# M01 complete local infrastructure. All resources are new-platform owned.
name: ics-v1-dev

x-runtime: &runtime
  labels:
    org.ics.instance: ${INFRA_INSTANCE_ID:?INFRA_INSTANCE_ID required}
    org.ics.environment: ${INFRA_ENV:-dev}
  restart: unless-stopped
  networks: [infra]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  mysql:
    <<: *runtime
    image: ics-mysql:8.4.11-ics.1@sha256:30522be8a94e195f37d43a72638449d206a0b0ce57f9502f8999cdef8cfa9ec5
    pull_policy: never
    networks: [infra, local]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER required}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      TZ: UTC
    secrets: [mysql_root_password, mysql_password]
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci]
    ports: ['127.0.0.1:${MYSQL_PORT:?MYSQL_PORT required}:3306']
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql --protocol=TCP -h127.0.0.1 -uroot -Nse "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 1536m

  redis:
    <<: *runtime
    image: ics-redis:8.8.2-ics.1@sha256:a3bf2dc42d377fd2afbe6e620d0a948b1f4ecc9fba88df84a7eef9cced1c7788
    pull_policy: never
    networks: [infra, local]
    command: [redis-server, /run/secrets/redis_config]
    secrets: [redis_password, redis_config]
    ports: ['127.0.0.1:${REDIS_PORT:?REDIS_PORT required}:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --raw ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 384m

  etcd:
    <<: *runtime
    image: ics-etcd:3.6.14-ics.2@sha256:de0b5e07f492b6ceb15b51ef14593142ce43ac66b0ad5c7973a3d7660f32ca3d
    pull_policy: never
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command: [--name=ics-etcd, --data-dir=/etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --listen-peer-urls=http://127.0.0.1:2380, --initial-advertise-peer-urls=http://127.0.0.1:2380, --initial-cluster=ics-etcd=http://127.0.0.1:2380]
    volumes: [etcd_data:/etcd]
    healthcheck:
      test: [CMD, /usr/local/bin/etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 512m

  seaweedfs:
    <<: *runtime
    image: ics-seaweedfs:4.45-m01-security.2@sha256:2ef7d372b429429c99116975d6ecfe789736d95ba43c00b7775b9510202273ba
    pull_policy: never
    networks: [infra, local]
    command: [server, -dir=/data, -master.dir=/data/master, -ip=seaweedfs, -ip.bind=0.0.0.0, -master.port=9333, -volume.port=8080, -volume.max=32, -filer.port=8888, -filer.disableDirListing=true, -filer.exposeDirectoryData=false, -master.telemetry=false, -s3, -s3.port=8333, -s3.ip.bind=0.0.0.0, -s3.config=/run/secrets/seaweed_s3_config, -s3.iam=false, -s3.autoCreateBucket=false, -webdav=false]
    secrets:
      - {source: seaweed_s3_config, target: /run/secrets/seaweed_s3_config}
      - {source: seaweed_security_config, target: /etc/seaweedfs/security.toml}
    ports: ['127.0.0.1:${S3_PORT:?S3_PORT required}:8333']
    volumes: [seaweedfs_data:/data]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    healthcheck:
      test: [CMD, /bin/busybox, wget, -q, -T, '2', -O, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    mem_limit: 1024m

  milvus:
    <<: *runtime
    image: ics-milvus:2.6.23-ics.2@sha256:433dae6cd83235e5e412dc7f7c62090f72e132e429bd2e5983dff704ff5e7e47
    pull_policy: never
    networks: [infra, local]
    command: [milvus, run, standalone]
    depends_on:
      etcd: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
    secrets:
      - {source: milvus_config, target: /milvus/configs/user.yaml}
    ports: ['127.0.0.1:${MILVUS_PORT:?MILVUS_PORT required}:19530']
    volumes: [milvus_data:/var/lib/milvus]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9091/healthz]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s
    mem_limit: 3072m

networks:
  local:
    driver: bridge
    driver_opts: {com.docker.network.bridge.host_binding_ipv4: '127.0.0.1'}
    labels: {org.ics.instance: '${INFRA_INSTANCE_ID:?INFRA_INSTANCE_ID required}'}
  infra:
    internal: true
    labels: {org.ics.instance: '${INFRA_INSTANCE_ID:?INFRA_INSTANCE_ID required}'}

volumes:
  mysql_data: {labels: {org.ics.instance: '${INFRA_INSTANCE_ID:?INFRA_INSTANCE_ID required}'}}
  redis_data: {labels: {org.ics.instance: '${INFRA_INSTANCE_ID:?INFRA_INSTANCE_ID required}'}}
  etcd_data: {labels: {org.ics.instance: '${INFRA_INSTANCE_ID:?INFRA_INSTANCE_ID required}'}}
  seaweedfs_data: {labels: {org.ics.instance: '${INFRA_INSTANCE_ID:?INFRA_INSTANCE_ID required}'}}
  milvus_data: {labels: {org.ics.instance: '${INFRA_INSTANCE_ID:?INFRA_INSTANCE_ID required}'}}

secrets:
  mysql_root_password: {file: ./secrets/mysql_root_password}
  mysql_password: {file: ./secrets/mysql_password}
  redis_password: {file: ./secrets/redis_password}
  redis_config: {file: ./secrets/redis_config}
  seaweed_s3_config: {file: ./secrets/seaweed_s3_config}
  seaweed_security_config: {file: ./secrets/seaweed_security_config}
  milvus_config: {file: ./secrets/milvus_config}
  milvus_root_password: {file: ./secrets/milvus_root_password}
