target: all
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: '0.0.0.0:4317'}
        http: {endpoint: '0.0.0.0:4318'}
storage:
  trace:
    backend: local
    local: {path: /data/blocks}
    wal: {path: /data/wal}
# Tempo 3 monolithic mode: no Kafka and no legacy compactor component.
live_store:
  max_trace_idle: 10s
  max_block_duration: 1m
  max_block_bytes: 1000000
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 24h
usage_report:
  reporting_enabled: false
