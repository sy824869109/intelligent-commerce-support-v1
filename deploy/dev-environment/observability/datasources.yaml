apiVersion: 1
datasources:
  - name: Metrics
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Traces
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
  - name: Logs
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
