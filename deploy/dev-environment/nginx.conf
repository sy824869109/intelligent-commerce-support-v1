pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  # Do not persist credentials, query strings, or customer request bodies in access logs.
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Only Nginx has an edge network. These diagnostic listeners are published
  # exclusively on host loopback; all telemetry stores retain their internal network.
  server { listen 3000; location / { proxy_pass http://grafana:3000; proxy_set_header Host $http_host; } }
  server { listen 9090; location / { proxy_pass http://prometheus:9090; } }
  server { listen 13133; location / { proxy_pass http://otel:13133; } }
  server { listen 3200; location / { proxy_pass http://tempo:3200; } }
  server { listen 3100; location / { proxy_pass http://loki:3100; } }
  server {
    listen 4318;
    client_max_body_size 10m;
    location / { proxy_pass http://otel:4318; }
  }
  server {
    listen 4317;
    http2 on;
    location / { grpc_pass grpc://otel:4317; }
  }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/tls/server.pem;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location = /environment/health { default_type application/json; return 200 '{"environment":"ready","business":"not_implemented"}'; }
    location = /health/ready { proxy_pass http://host.docker.internal:28000/health/ready; }
    location = / { default_type text/plain; return 200 'ICS V1 environment entry. Business pages are built in later lessons.\n'; }
    location /api/ {
      proxy_pass http://host.docker.internal:28000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 65s;
      proxy_send_timeout 15s;
    }
    location / { return 404; }
  }
}
