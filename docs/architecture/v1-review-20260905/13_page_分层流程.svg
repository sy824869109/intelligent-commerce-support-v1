<svg xmlns="http://www.w3.org/2000/svg" id="diagram-page" width="1200" height="2482" viewBox="0 0 1200 2482" role="img" aria-labelledby="title-page">
<title id="title-page">第 2 层 · 页面申请与聊天如何共用事实</title>
<defs><marker id="arrow-page" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#65cbe0"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#diagram-page .flow-edge{fill:none;stroke:#65cbe0;stroke-width:2;marker-end:url(#arrow-page)}#diagram-page .side-edge{stroke-dasharray:6 4}a:hover text{text-decoration:underline}</style>
<rect width="1200" height="2482" fill="#0c1626"/>
<text x="42" y="49" font-size="30" fill="#65cbe0" font-weight="700">第 2 层 · 页面申请与聊天如何共用事实</text>
<text x="42" y="86" font-size="20" fill="#b8c8dd" font-weight="400">纵向实线＝选中路径的先后顺序；侧向虚线＝条件出口 / 例外；跨图入口标注目的地。</text>
<text x="42" y="119" font-size="19" fill="#f1be63" font-weight="400">V1 目标设计 · 标准 1.1 · 示例均为虚构 DEMO · 不代表运行验收通过</text>
<path class="flow-edge side-edge" d="M792,988 H856"/><path class="flow-edge side-edge" d="M792,1369 H856"/><path class="flow-edge side-edge" d="M792,1807 H856"/><path class="flow-edge" d="M428,498 V566"/><path class="flow-edge" d="M428,851 V919"/><path class="flow-edge" d="M428,1232 V1300"/><path class="flow-edge" d="M428,1585 V1738"/><path class="flow-edge" d="M428,2023 V2091"/><rect x="42" y="158" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="187" font-size="21" fill="#c3d5eb" font-weight="700">页面入口：业务操作不是聊天消息</text><rect x="42" y="1683" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="1712" font-size="21" fill="#c3d5eb" font-weight="700">恢复与一致性：事实只认 N5</text><text x="449" y="530" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="883" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1264" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1617" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2055" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><g id="P01" class="node" data-box="64,223,728,275"><rect x="64" y="223" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="237" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="258" font-size="22" fill="#65cbe0" font-weight="700">P01  打开订单 / 售后页面</text><text x="83" y="289" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：浏览器 → N1 → N2 → N5</text><text x="83" y="325" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="325" font-size="20" fill="#d7e8fa" font-weight="400">登录身份、目标订单和页面查询参数</text><text x="83" y="361" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="361" font-size="20" fill="#edf4fe" font-weight="400">入口认证后，由 N5 再校验归属并查询当前事实。</text><text x="83" y="397" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="397" font-size="20" fill="#74d7ad" font-weight="400">授权订单 / 商品行 / 可申请范围</text><text x="83" y="433" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="433" font-size="20" fill="#b8c8dd" font-weight="400">读取 N5，既不调 KF，也不创建聊天记录。</text><text x="83" y="469" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="469" font-size="20" fill="#f1be63" font-weight="400">U01 打开 O1001，选 L1 ×1。</text></g><g id="P02" class="node" data-box="64,576,728,275"><rect x="64" y="576" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="590" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="611" font-size="22" fill="#65cbe0" font-weight="700">P02  填写申请并请求同一个 N5 预检</text><text x="83" y="642" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：浏览器 → N2 → N5 preflight</text><text x="83" y="678" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="678" font-size="20" fill="#d7e8fa" font-weight="400">动作、数量、理由、READY 材料引用</text><text x="83" y="714" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="714" font-size="20" fill="#edf4fe" font-weight="400">重验权限、状态和规则，绑定载荷哈希及展示摘要。</text><text x="83" y="750" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="750" font-size="20" fill="#74d7ad" font-weight="400">PF02、有效期、事实 / 规则版本和申请摘要</text><text x="83" y="786" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="786" font-size="20" fill="#b8c8dd" font-weight="400">N5 拥有 preflight；页面不创建 N4 Workflow。</text><text x="83" y="822" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="822" font-size="20" fill="#f1be63" font-weight="400">DEMO 摘要：申请退货，L1 ×1，申请金额 19900 分 CNY。</text></g><g id="P03" class="node" data-box="64,929,728,303"><rect x="64" y="929" width="728" height="303" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="943" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="964" font-size="22" fill="#f1be63" font-weight="700">P03  用户核对并明确确认</text><text x="83" y="995" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：浏览器 / N5</text><text x="83" y="1031" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1031" font-size="20" fill="#d7e8fa" font-weight="400">PF02 和预检给出的原摘要</text><text x="83" y="1067" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1067" font-size="20" fill="#edf4fe" font-weight="400">用与提交载荷相同的信息让用户确认；不能默认勾选或用阅读代替</text><text x="141" y="1095" font-size="20" fill="#edf4fe" font-weight="400">确认。</text><text x="83" y="1131" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1131" font-size="20" fill="#74d7ad" font-weight="400">当前有效预检下的明确提交动作</text><text x="83" y="1167" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1167" font-size="20" fill="#b8c8dd" font-weight="400">N5 保存服务端确认 / 提交证据；按钮禁用不能代替幂等。</text><text x="83" y="1203" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1203" font-size="20" fill="#f1be63" font-weight="400">改数量、改操作、过期或事实变化 → 新预检和新确认。</text></g><g class="side-node" data-box="866,953,294,130"><rect x="866" y="953" width="294" height="130" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="982" font-size="20" fill="#f1be63" font-weight="700">变更 / 取消</text><text x="882" y="1018" font-size="19" fill="#f3dee0" font-weight="400">未提交可取消；载荷变化回</text><text x="882" y="1045" font-size="19" fill="#f3dee0" font-weight="400">P02，不复用旧预检。</text></g><g id="P04" class="node" data-box="64,1310,728,275"><rect x="64" y="1310" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1324" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1345" font-size="22" fill="#65cbe0" font-weight="700">P04  调用统一受控提交端口</text><text x="83" y="1376" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：浏览器 → N2 → N5 submit</text><text x="83" y="1412" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1412" font-size="20" fill="#d7e8fa" font-weight="400">PF02、原载荷、稳定幂等标识</text><text x="83" y="1448" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1448" font-size="20" fill="#edf4fe" font-weight="400">同预检只映射一个 command_id；N5 再核验所有领域约束。</text><text x="83" y="1484" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1484" font-size="20" fill="#74d7ad" font-weight="400">CMD02；真实命令执行 / 受理状态</text><text x="83" y="1520" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1520" font-size="20" fill="#b8c8dd" font-weight="400">N5 保存命令与业务事实；channel=PAGE 仅审计。</text><text x="83" y="1556" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1556" font-size="20" fill="#f1be63" font-weight="400">CHAT 与 PAGE 不构成两份权限，也不能绕过可申请数量。</text></g><g class="side-node" data-box="866,1334,294,157"><rect x="866" y="1334" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1363" font-size="20" fill="#f1be63" font-weight="700">另一入口重复申请</text><text x="882" y="1399" font-size="19" fill="#f3dee0" font-weight="400">不同预检 / 不同键仍受 N5</text><text x="882" y="1426" font-size="19" fill="#f3dee0" font-weight="400">剩余数量和业务语义约束；不</text><text x="882" y="1453" font-size="19" fill="#f3dee0" font-weight="400">能超额创建。</text></g><g id="P05" class="node" data-box="64,1748,728,275"><rect x="64" y="1748" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1762" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1783" font-size="22" fill="#65cbe0" font-weight="700">P05  结果未知时查原命令</text><text x="83" y="1814" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：页面 → N2 → N5 query</text><text x="83" y="1850" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1850" font-size="20" fill="#d7e8fa" font-weight="400">CMD02 / 原幂等关联</text><text x="83" y="1886" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1886" font-size="20" fill="#edf4fe" font-weight="400">超时或刷新查同一个命令；收到 UNKNOWN 不当成失败后另建。</text><text x="83" y="1922" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1922" font-size="20" fill="#74d7ad" font-weight="400">确定结果，或仍待查询 / 对账的状态</text><text x="83" y="1958" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1958" font-size="20" fill="#b8c8dd" font-weight="400">N5 是权威；本地缓存没有结果不代表提交失败。</text><text x="83" y="1994" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1994" font-size="20" fill="#f1be63" font-weight="400">200 查询响应只表示查到当前状态，不承诺申请成功。</text></g><g class="side-node" data-box="866,1772,294,130"><rect x="866" y="1772" width="294" height="130" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1801" font-size="20" fill="#f1be63" font-weight="700">页面失联</text><text x="882" y="1837" font-size="19" fill="#f3dee0" font-weight="400">重新认证后恢复查询；没有必</text><text x="882" y="1864" font-size="19" fill="#f3dee0" font-weight="400">要创建一段假聊天来恢复。</text></g><g id="P06" class="node" data-box="64,2101,728,275"><rect x="64" y="2101" width="728" height="275" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="2115" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="2136" font-size="22" fill="#74d7ad" font-weight="700">P06  页面展示真实申请，聊天可查询</text><text x="83" y="2167" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N5 → 页面；后续聊天经 N4 → N5</text><text x="83" y="2203" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2203" font-size="20" fill="#d7e8fa" font-weight="400">实际 after_sale_id、命令与申请状态</text><text x="83" y="2239" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2239" font-size="20" fill="#edf4fe" font-weight="400">展示申请单；以后聊天查询也读取同一 N5 事实。</text><text x="83" y="2275" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2275" font-size="20" fill="#74d7ad" font-weight="400">同一申请跨入口可见，权限每次校验</text><text x="83" y="2311" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2311" font-size="20" fill="#b8c8dd" font-weight="400">仅聊天查询的答复才由 N3 保存正式消息。</text><text x="83" y="2347" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2347" font-size="20" fill="#f1be63" font-weight="400">若 AS001 已占用 L1 全部数量，新申请被限制并提示已有单。</text></g>
<text x="42" y="2457" font-size="18" fill="#b8c8dd" font-weight="400">N1–N9 是责任节点，不是执行顺序；示例字段帮助审查，不替代后续正式 API / 数据合同。</text>
</svg>