<svg xmlns="http://www.w3.org/2000/svg" id="diagram-routing" width="1200" height="3576" viewBox="0 0 1200 3576" role="img" aria-labelledby="title-routing">
<title id="title-routing">第 2 层 · 路由按优先级逐关判断</title>
<defs><marker id="arrow-routing" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#65cbe0"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#diagram-routing .flow-edge{fill:none;stroke:#65cbe0;stroke-width:2;marker-end:url(#arrow-routing)}#diagram-routing .side-edge{stroke-dasharray:6 4}a:hover text{text-decoration:underline}</style>
<rect width="1200" height="3576" fill="#0c1626"/>
<text x="42" y="49" font-size="30" fill="#65cbe0" font-weight="700">第 2 层 · 路由按优先级逐关判断</text>
<text x="42" y="86" font-size="20" fill="#b8c8dd" font-weight="400">纵向实线＝选中路径的先后顺序；侧向虚线＝条件出口 / 例外；跨图入口标注目的地。</text>
<text x="42" y="119" font-size="19" fill="#f1be63" font-weight="400">V1 目标设计 · 标准 1.1 · 示例均为虚构 DEMO · 不代表运行验收通过</text>
<path class="flow-edge side-edge" d="M792,635 H856"/><path class="flow-edge side-edge" d="M792,988 H856"/><path class="flow-edge side-edge" d="M792,1341 H856"/><path class="flow-edge side-edge" d="M792,1779 H856"/><path class="flow-edge side-edge" d="M792,2132 H856"/><path class="flow-edge side-edge" d="M792,2485 H856"/><path class="flow-edge side-edge" d="M792,2866 H856"/><path class="flow-edge" d="M428,498 V566"/><path class="flow-edge" d="M428,851 V919"/><path class="flow-edge" d="M428,1204 V1272"/><path class="flow-edge" d="M428,1557 V1710"/><path class="flow-edge" d="M428,1995 V2063"/><path class="flow-edge" d="M428,2348 V2416"/><path class="flow-edge" d="M428,2729 V2797"/><path class="flow-edge" d="M428,3082 V3150"/><rect x="42" y="158" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="187" font-size="21" fill="#c3d5eb" font-weight="700">第一优先级：安全 / 人工 / 控制</text><rect x="42" y="1655" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="1684" font-size="21" fill="#c3d5eb" font-weight="700">第二优先级：明确业务性质</text><text x="449" y="530" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="883" font-size="17" fill="#b4c9df" font-weight="400">均未命中，向下</text><text x="449" y="1236" font-size="17" fill="#b4c9df" font-weight="400">没有活动流程，向下</text><text x="449" y="1589" font-size="17" fill="#b4c9df" font-weight="400">信息充分，向下</text><text x="449" y="2027" font-size="17" fill="#b4c9df" font-weight="400">不是单纯查事实，向下</text><text x="449" y="2380" font-size="17" fill="#b4c9df" font-weight="400">不是单纯问知识，向下</text><text x="449" y="2761" font-size="17" fill="#b4c9df" font-weight="400">不是混合咨询，向下</text><text x="449" y="3114" font-size="17" fill="#b4c9df" font-weight="400">仍不匹配，向下</text><g id="B01" class="node" data-box="64,223,728,275"><rect x="64" y="223" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="237" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="258" font-size="22" fill="#65cbe0" font-weight="700">B01  接收授权输入与控制快照</text><text x="83" y="289" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N3 → N4</text><text x="83" y="325" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="325" font-size="20" fill="#d7e8fa" font-weight="400">问题、会话模式、Workflow、历史授权范围</text><text x="83" y="361" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="361" font-size="20" fill="#edf4fe" font-weight="400">只消费本轮有效输入；历史问题不是新的执行授权。</text><text x="83" y="397" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="397" font-size="20" fill="#74d7ad" font-weight="400">本轮可判定的信息；身份失效退回 N2 重新授权</text><text x="83" y="433" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="433" font-size="20" fill="#b8c8dd" font-weight="400">N4 路由记录绑定 Run / epoch。</text><text x="83" y="469" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="469" font-size="20" fill="#f1be63" font-weight="400">问 O1001 能否退货；AI 模式，无活动 Workflow。</text></g><g id="B02" class="node" data-box="64,576,728,275"><rect x="64" y="576" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="590" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="611" font-size="22" fill="#f1be63" font-weight="700">B02  是否必须拒绝，或要求 / 需要人工？</text><text x="83" y="642" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4；控制由 N3 持有</text><text x="83" y="678" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="678" font-size="20" fill="#d7e8fa" font-weight="400">安全规则、人工请求、风险、会话模式</text><text x="83" y="714" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="714" font-size="20" fill="#edf4fe" font-weight="400">被禁止的操作拒绝；人工请求优先；HUMAN 模式不启动 AI。</text><text x="83" y="750" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="750" font-size="20" fill="#74d7ad" font-weight="400">未命中 → B03；命中 → 右侧对应出口</text><text x="83" y="786" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="786" font-size="20" fill="#b8c8dd" font-weight="400">控制改变写 N3；人工受理记录写 N7。</text><text x="83" y="822" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="822" font-size="20" fill="#f1be63" font-weight="400">“帮我退钱”不授权自动扣付；“找人工”进入人工链。</text></g><g class="side-node" data-box="866,600,294,179"><rect x="866" y="600" width="294" height="179" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="629" font-size="20" fill="#f1be63" font-weight="700">命中：离开路由主干</text><text x="882" y="665" font-size="19" fill="#f3dee0" font-weight="400">禁止操作 → REFUSE → 图</text><text x="882" y="692" font-size="19" fill="#f3dee0" font-weight="400">10；人工 → 图 11；</text><text x="882" y="719" font-size="19" fill="#f3dee0" font-weight="400">HUMAN 直接人工处理。</text><a href="V1分层流程与示例.html#human" data-open="human"><text x="882" y="753" font-size="18" fill="#65cbe0" font-weight="700">查看图 11 →</text></a></g><g id="B03" class="node" data-box="64,929,728,275"><rect x="64" y="929" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="943" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="964" font-size="22" fill="#f1be63" font-weight="700">B03  是否在已有业务工作流中？</text><text x="83" y="995" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 Workflow</text><text x="83" y="1031" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1031" font-size="20" fill="#d7e8fa" font-weight="400">current_workflow / version / 待确认摘要</text><text x="83" y="1067" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1067" font-size="20" fill="#edf4fe" font-weight="400">优先处理取消、修改、继续或明确确认；改内容即废止旧确认。</text><text x="83" y="1103" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1103" font-size="20" fill="#74d7ad" font-weight="400">无活动流程 → B04；有流程 → 相应步骤</text><text x="83" y="1139" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1139" font-size="20" fill="#b8c8dd" font-weight="400">N4 更新工作流版本；已提交命令另查 N5。</text><text x="83" y="1175" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1175" font-size="20" fill="#f1be63" font-weight="400">“不退了，改换货” → 作废原退货确认，再预检。</text></g><g class="side-node" data-box="866,953,294,179"><rect x="866" y="953" width="294" height="179" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="982" font-size="20" fill="#f1be63" font-weight="700">命中：不是重新分类</text><text x="882" y="1018" font-size="19" fill="#f3dee0" font-weight="400">待确认 → 图 08 T08；已</text><text x="882" y="1045" font-size="19" fill="#f3dee0" font-weight="400">提交且结果未知 → 查原</text><text x="882" y="1072" font-size="19" fill="#f3dee0" font-weight="400">command_id。</text><a href="V1分层流程与示例.html#mixed" data-open="mixed"><text x="882" y="1106" font-size="18" fill="#65cbe0" font-weight="700">查看图 08 →</text></a></g><g id="B04" class="node" data-box="64,1282,728,275"><rect x="64" y="1282" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="1296" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="1317" font-size="22" fill="#f1be63" font-weight="700">B04  目标或必要信息是否缺失 / 冲突？</text><text x="83" y="1348" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4；授权候选由 N5 提供</text><text x="83" y="1384" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1384" font-size="20" fill="#d7e8fa" font-weight="400">本轮涉及的订单、商品行、数量、目的</text><text x="83" y="1420" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1420" font-size="20" fill="#edf4fe" font-weight="400">业务问题缺目标先澄清；纯政策问答不强索取订单号。</text><text x="83" y="1456" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1456" font-size="20" fill="#74d7ad" font-weight="400">信息充分 → B05；不足 → CLARIFY → 图 10</text><text x="83" y="1492" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1492" font-size="20" fill="#b8c8dd" font-weight="400">N4 只保存获授权的收集槽位。</text><text x="83" y="1528" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1528" font-size="20" fill="#f1be63" font-weight="400">“帮我退那个”且有两个订单 → 请用户选择，不猜订单。</text></g><g class="side-node" data-box="866,1306,294,152"><rect x="866" y="1306" width="294" height="152" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1335" font-size="20" fill="#f1be63" font-weight="700">是：本轮只问清楚</text><text x="882" y="1371" font-size="19" fill="#f3dee0" font-weight="400">返回合法候选或追问；等下一</text><text x="882" y="1398" font-size="19" fill="#f3dee0" font-weight="400">轮补充，不执行申请。</text><a href="V1分层流程与示例.html#publish" data-open="publish"><text x="882" y="1432" font-size="18" fill="#65cbe0" font-weight="700">查看图 10 →</text></a></g><g id="B05" class="node" data-box="64,1720,728,275"><rect x="64" y="1720" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="1734" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="1755" font-size="22" fill="#f1be63" font-weight="700">B05  是否只是查询业务事实？</text><text x="83" y="1786" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → N5 Commerce</text><text x="83" y="1822" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1822" font-size="20" fill="#d7e8fa" font-weight="400">已授权订单 / 商品 / 包裹 ID</text><text x="83" y="1858" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1858" font-size="20" fill="#edf4fe" font-weight="400">只读真实事实，必要时选择具体商品行或包裹。</text><text x="83" y="1894" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1894" font-size="20" fill="#74d7ad" font-weight="400">是 → COMMERCE_READ → N5 结果 → 图 10</text><text x="83" y="1930" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1930" font-size="20" fill="#b8c8dd" font-weight="400">只读不创建售后；N5 保留查询审计。</text><text x="83" y="1966" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1966" font-size="20" fill="#f1be63" font-weight="400">“O1001 物流到哪了？” → 分包裹状态和更新时间。</text></g><g class="side-node" data-box="866,1744,294,152"><rect x="866" y="1744" width="294" height="152" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1773" font-size="20" fill="#f1be63" font-weight="700">是：读完即收口</text><text x="882" y="1809" font-size="19" fill="#f3dee0" font-weight="400">数据不可用就明确说明；不可</text><text x="882" y="1836" font-size="19" fill="#f3dee0" font-weight="400">用模型补一个物流状态。</text><a href="V1分层流程与示例.html#publish" data-open="publish"><text x="882" y="1870" font-size="18" fill="#65cbe0" font-weight="700">查看图 10 →</text></a></g><g id="B06" class="node" data-box="64,2073,728,275"><rect x="64" y="2073" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="2087" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="2108" font-size="22" fill="#f1be63" font-weight="700">B06  是否只问通用知识或政策？</text><text x="83" y="2139" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → N6 Knowledge / KF</text><text x="83" y="2175" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2175" font-size="20" fill="#d7e8fa" font-weight="400">问题 + 授权知识域 + 正式历史快照</text><text x="83" y="2211" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2211" font-size="20" fill="#edf4fe" font-weight="400">查询已发布适用知识；不据通用政策判定具体订单资格。</text><text x="83" y="2247" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2247" font-size="20" fill="#74d7ad" font-weight="400">是 → KNOWLEDGE → 图 09 → 图 10</text><text x="83" y="2283" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2283" font-size="20" fill="#b8c8dd" font-weight="400">N6 诊断不替代 N3 正式历史。</text><text x="83" y="2319" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2319" font-size="20" fill="#f1be63" font-weight="400">“退货需要准备什么？” → 回答材料和来源。</text></g><g class="side-node" data-box="866,2097,294,152"><rect x="866" y="2097" width="294" height="152" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2126" font-size="20" fill="#f1be63" font-weight="700">是：只给知识答复</text><text x="882" y="2162" font-size="19" fill="#f3dee0" font-weight="400">没有资格判定，也没有业务写</text><text x="882" y="2189" font-size="19" fill="#f3dee0" font-weight="400">入。</text><a href="V1分层流程与示例.html#kf" data-open="kf"><text x="882" y="2223" font-size="18" fill="#65cbe0" font-weight="700">查看图 09 →</text></a></g><g id="B07" class="node" data-box="64,2426,728,303"><rect x="64" y="2426" width="728" height="303" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="2440" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="2461" font-size="22" fill="#f1be63" font-weight="700">B07  是否在咨询具体对象的政策或资格？</text><text x="83" y="2492" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 顺序协调</text><text x="83" y="2528" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2528" font-size="20" fill="#d7e8fa" font-weight="400">已选定对象 + 政策 / 资格咨询</text><text x="83" y="2564" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2564" font-size="20" fill="#edf4fe" font-weight="400">咨询时先 N5 事实，再 N6 政策、N5 规则；明确请求办理走</text><text x="141" y="2592" font-size="20" fill="#edf4fe" font-weight="400">B08。</text><text x="83" y="2628" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2628" font-size="20" fill="#74d7ad" font-weight="400">是 → MIXED → 图 08 T01–T06 → 图 10</text><text x="83" y="2664" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2664" font-size="20" fill="#b8c8dd" font-weight="400">资格由 N5 判断，N6 不拥有订单审批权。</text><text x="83" y="2700" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2700" font-size="20" fill="#f1be63" font-weight="400">“O1001 的杯子裂了，可以申请退货吗？”</text></g><g class="side-node" data-box="866,2450,294,152"><rect x="866" y="2450" width="294" height="152" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2479" font-size="20" fill="#f1be63" font-weight="700">是：混合路径</text><text x="882" y="2515" font-size="19" fill="#f3dee0" font-weight="400">先回答是否可申请；不要把咨</text><text x="882" y="2542" font-size="19" fill="#f3dee0" font-weight="400">询当作确认。</text><a href="V1分层流程与示例.html#mixed" data-open="mixed"><text x="882" y="2576" font-size="18" fill="#65cbe0" font-weight="700">查看图 08 →</text></a></g><g id="B08" class="node" data-box="64,2807,728,275"><rect x="64" y="2807" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="2821" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="2842" font-size="22" fill="#f1be63" font-weight="700">B08  是否请求受支持的受控业务操作？</text><text x="83" y="2873" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → N5 统一命令端口</text><text x="83" y="2909" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2909" font-size="20" fill="#d7e8fa" font-weight="400">动作、目标、业务范围模式及必要材料</text><text x="83" y="2945" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2945" font-size="20" fill="#edf4fe" font-weight="400">在支持范围内收集 → 预检 → 明确确认 → 同键提交。</text><text x="83" y="2981" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2981" font-size="20" fill="#74d7ad" font-weight="400">是 → BUSINESS_COMMAND → 图 08 T07–T11</text><text x="83" y="3017" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3017" font-size="20" fill="#b8c8dd" font-weight="400">N4 确认意图；N5 预检、命令及业务结果。</text><text x="83" y="3053" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3053" font-size="20" fill="#f1be63" font-weight="400">“我要申请退货” → 展示摘要，等用户明确确认。</text></g><g class="side-node" data-box="866,2831,294,179"><rect x="866" y="2831" width="294" height="179" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2860" font-size="20" fill="#f1be63" font-weight="700">是：不能跳过确认</text><text x="882" y="2896" font-size="19" fill="#f3dee0" font-weight="400">LIVE / DEMO 明示；</text><text x="882" y="2923" font-size="19" fill="#f3dee0" font-weight="400">HUMAN_ONLY 转人工；</text><text x="882" y="2950" font-size="19" fill="#f3dee0" font-weight="400">UNSUPPORTED 不支持。</text><a href="V1分层流程与示例.html#mixed" data-open="mixed"><text x="882" y="2984" font-size="18" fill="#65cbe0" font-weight="700">查看图 08 →</text></a></g><g id="B09" class="node" data-box="64,3160,728,310"><rect x="64" y="3160" width="728" height="310" rx="12" fill="#122137" stroke="#f1999f" stroke-width="2"/><rect x="64" y="3174" width="5" height="38" rx="2" fill="#f1999f"/><text x="83" y="3195" font-size="22" fill="#f1999f" font-weight="700">B09  兜底：澄清、真实人工或明确不支持</text><text x="83" y="3226" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → N3 / N7</text><text x="83" y="3262" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="3262" font-size="20" fill="#d7e8fa" font-weight="400">未识别、证据矛盾或超出支持范围的问题</text><text x="83" y="3298" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="3298" font-size="20" fill="#edf4fe" font-weight="400">不给虚构结论；提供具体可选的下一步。</text><text x="83" y="3334" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3334" font-size="20" fill="#74d7ad" font-weight="400">CLARIFY / HUMAN / REFUSE；不静默执行</text><text x="83" y="3370" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3370" font-size="20" fill="#b8c8dd" font-weight="400">记录失败归因；没有受理回执不称已受理。</text><text x="83" y="3406" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3406" font-size="20" fill="#f1be63" font-weight="400">“把积分转成现金”不在 V1 自动办理范围 → 说明边界。</text><a href="V1分层流程与示例.html#publish" data-open="publish"><text x="83" y="3442" font-size="18" fill="#65cbe0" font-weight="700">展开图 10 → 所有 AI 分支怎样正式收口</text></a></g>
<text x="42" y="3551" font-size="18" fill="#b8c8dd" font-weight="400">N1–N9 是责任节点，不是执行顺序；示例字段帮助审查，不替代后续正式 API / 数据合同。</text>
</svg>