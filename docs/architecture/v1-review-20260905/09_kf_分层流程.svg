<svg xmlns="http://www.w3.org/2000/svg" id="diagram-kf" width="1200" height="3625" viewBox="0 0 1200 3625" role="img" aria-labelledby="title-kf">
<title id="title-kf">第 3 层 · KF 原核心逐步展开</title>
<defs><marker id="arrow-kf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#65cbe0"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#diagram-kf .flow-edge{fill:none;stroke:#65cbe0;stroke-width:2;marker-end:url(#arrow-kf)}#diagram-kf .side-edge{stroke-dasharray:6 4}a:hover text{text-decoration:underline}</style>
<rect width="1200" height="3625" fill="#0c1626"/>
<text x="42" y="49" font-size="30" fill="#65cbe0" font-weight="700">第 3 层 · KF 原核心逐步展开</text>
<text x="42" y="86" font-size="20" fill="#b8c8dd" font-weight="400">纵向实线＝选中路径的先后顺序；侧向虚线＝条件出口 / 例外；跨图入口标注目的地。</text>
<text x="42" y="119" font-size="19" fill="#f1be63" font-weight="400">V1 目标设计 · 标准 1.1 · 示例均为虚构 DEMO · 不代表运行验收通过</text>
<path class="flow-edge side-edge" d="M792,1101 H856"/><path class="flow-edge side-edge" d="M792,1835 H856"/><path class="flow-edge side-edge" d="M792,2541 H856"/><path class="flow-edge side-edge" d="M792,3275 H856"/><path class="flow-edge" d="M428,526 V679"/><path class="flow-edge" d="M428,964 V1032"/><path class="flow-edge" d="M428,1317 V1385"/><path class="flow-edge" d="M428,1698 V1766"/><path class="flow-edge" d="M428,2051 V2119"/><path class="flow-edge" d="M428,2404 V2472"/><path class="flow-edge" d="M428,2757 V2825"/><path class="flow-edge" d="M428,3138 V3206"/><rect x="42" y="158" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="187" font-size="21" fill="#c3d5eb" font-weight="700">平台包装：权限先于检索 / 缓存 / 模型</text><rect x="42" y="624" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="653" font-size="21" fill="#c3d5eb" font-weight="700">KF 原有主干：从 K0 向下</text><text x="449" y="558" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="996" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1349" font-size="17" fill="#b4c9df" font-weight="400">需要检索，向下</text><text x="449" y="1730" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2083" font-size="17" fill="#b4c9df" font-weight="400">未直出，按计划继续</text><text x="449" y="2436" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2789" font-size="17" fill="#b4c9df" font-weight="400">证据可用，向下</text><text x="449" y="3170" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><g id="G00" class="node" data-box="64,223,728,303"><rect x="64" y="223" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="237" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="258" font-size="22" fill="#65cbe0" font-weight="700">G00  N6 授权包装与请求级历史适配</text><text x="83" y="289" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → N6</text><text x="83" y="325" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="325" font-size="20" fill="#d7e8fa" font-weight="400">当前问题 + 最小业务属性 + N3 正式历史快照</text><text x="83" y="361" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="361" font-size="20" fill="#edf4fe" font-weight="400">校验租户、知识可见性、场景，绑定已发布版本和请求级</text><text x="141" y="389" font-size="20" fill="#edf4fe" font-weight="400">History Adapter。</text><text x="83" y="425" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="425" font-size="20" fill="#74d7ad" font-weight="400">授权 Query Context；只向模型发送必要信息</text><text x="83" y="461" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="461" font-size="20" fill="#b8c8dd" font-weight="400">读历史只取 N3 快照；不临时修改共享单例 history。</text><text x="83" y="497" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="497" font-size="20" fill="#f1be63" font-weight="400">Q：破损申请要什么材料？知识域 T01，版本 KB003。</text></g><g id="K0" class="node" data-box="64,689,728,275"><rect x="64" y="689" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="703" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="724" font-size="22" fill="#65cbe0" font-weight="700">K0  创建 KF 查询上下文</text><text x="83" y="755" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：KF Stage 0</text><text x="83" y="791" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="791" font-size="20" fill="#d7e8fa" font-weight="400">问题、场景、检索权限、会话和 Trace</text><text x="83" y="827" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="827" font-size="20" fill="#edf4fe" font-weight="400">建立本次 Pipeline 状态及版本绑定。</text><text x="83" y="863" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="863" font-size="20" fill="#74d7ad" font-weight="400">本次 context，进入 K1</text><text x="83" y="899" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="899" font-size="20" fill="#b8c8dd" font-weight="400">诊断关联 tenant / run；不写平台正式消息。</text><text x="83" y="935" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="935" font-size="20" fill="#f1be63" font-weight="400">同一次 R02 只用已授权、兼容的 KB003。</text></g><g id="K1" class="node" data-box="64,1042,728,275"><rect x="64" y="1042" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="1056" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="1077" font-size="22" fill="#f1be63" font-weight="700">K1  低成本路由</text><text x="83" y="1108" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：KF Stage 1</text><text x="83" y="1144" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1144" font-size="20" fill="#d7e8fa" font-weight="400">当前问题和场景配置</text><text x="83" y="1180" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1180" font-size="20" fill="#edf4fe" font-weight="400">判断确定性直答或 FAQ 精确命中，否则准备检索。</text><text x="83" y="1216" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1216" font-size="20" fill="#74d7ad" font-weight="400">继续检索 → K2；确定直答 → K7</text><text x="83" y="1252" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1252" font-size="20" fill="#b8c8dd" font-weight="400">保留路由诊断；不产生订单资格。</text><text x="83" y="1288" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1288" font-size="20" fill="#f1be63" font-weight="400">若“营业时间”精确命中可直接取标准答案。</text></g><g class="side-node" data-box="866,1066,294,130"><rect x="866" y="1066" width="294" height="130" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1095" font-size="20" fill="#f1be63" font-weight="700">直答出口 → K7</text><text x="882" y="1131" font-size="19" fill="#f3dee0" font-weight="400">跳过 K2–K6；仍走统一收尾</text><text x="882" y="1158" font-size="19" fill="#f3dee0" font-weight="400">，再由平台校验发布。</text></g><g id="K2" class="node" data-box="64,1395,728,303"><rect x="64" y="1395" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1409" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1430" font-size="22" fill="#65cbe0" font-weight="700">K2  准备检索</text><text x="83" y="1461" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：KF Stage 2 + 请求级 History Adapter</text><text x="83" y="1497" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1497" font-size="20" fill="#d7e8fa" font-weight="400">当前问句 + 授权正式历史 + 场景</text><text x="83" y="1533" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1533" font-size="20" fill="#edf4fe" font-weight="400">意图、按需改写、查询变体、来源过滤、检索计划与 Prompt</text><text x="141" y="1561" font-size="20" fill="#edf4fe" font-weight="400">Profile。</text><text x="83" y="1597" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1597" font-size="20" fill="#74d7ad" font-weight="400">检索计划和查询；不重复注入当前问题</text><text x="83" y="1633" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1633" font-size="20" fill="#b8c8dd" font-weight="400">只读授权快照；撤权后旧摘要 / 缓存失效重建。</text><text x="83" y="1669" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1669" font-size="20" fill="#f1be63" font-weight="400">“要准备哪些？”结合正式前文改写为破损申请材料。</text></g><g id="K3" class="node" data-box="64,1776,728,275"><rect x="64" y="1776" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="1790" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="1811" font-size="22" fill="#f1be63" font-weight="700">K3  FAQ 检索与直出判断</text><text x="83" y="1842" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：KF Stage 3</text><text x="83" y="1878" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1878" font-size="20" fill="#d7e8fa" font-weight="400">检索计划、查询、可见知识范围</text><text x="83" y="1914" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1914" font-size="20" fill="#edf4fe" font-weight="400">按计划混合召回，按配置重排，判断能否用标准答案直出。</text><text x="83" y="1950" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1950" font-size="20" fill="#74d7ad" font-weight="400">不满足直出 → K4；满足 → K7</text><text x="83" y="1986" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1986" font-size="20" fill="#b8c8dd" font-weight="400">读 Milvus；调用向量 / 可选重排模型。</text><text x="83" y="2022" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2022" font-size="20" fill="#f1be63" font-weight="400">已有完整且适用的材料清单，满足条件时直接返回。</text></g><g class="side-node" data-box="866,1800,294,130"><rect x="866" y="1800" width="294" height="130" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1829" font-size="20" fill="#f1be63" font-weight="700">FAQ 直出 → K7</text><text x="882" y="1865" font-size="19" fill="#f3dee0" font-weight="400">跳过后续文档检索和 LLM；</text><text x="882" y="1892" font-size="19" fill="#f3dee0" font-weight="400">不是跳过来源授权。</text></g><g id="K4" class="node" data-box="64,2129,728,275"><rect x="64" y="2129" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="2143" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="2164" font-size="22" fill="#65cbe0" font-weight="700">K4  文档召回与重排</text><text x="83" y="2195" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：KF Stage 4</text><text x="83" y="2231" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2231" font-size="20" fill="#d7e8fa" font-weight="400">查询变体、过滤条件、候选片段</text><text x="83" y="2267" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2267" font-size="20" fill="#edf4fe" font-weight="400">按原检索计划检索 / 重排；计划可关闭对应分支。</text><text x="83" y="2303" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2303" font-size="20" fill="#74d7ad" font-weight="400">文档片段、来源元数据、检索分数</text><text x="83" y="2339" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2339" font-size="20" fill="#b8c8dd" font-weight="400">Milvus 是派生索引；原文归 MinIO，元数据归 N6。</text><text x="83" y="2375" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2375" font-size="20" fill="#f1be63" font-weight="400">找到 P003 的材料段落及适用范围，不是整库原文。</text></g><g id="K5" class="node" data-box="64,2482,728,275"><rect x="64" y="2482" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="2496" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="2517" font-size="22" fill="#f1be63" font-weight="700">K5  整理生成上下文，检查证据</text><text x="83" y="2548" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：KF Stage 5</text><text x="83" y="2584" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2584" font-size="20" fill="#d7e8fa" font-weight="400">FAQ / 文档候选与上下文预算</text><text x="83" y="2620" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2620" font-size="20" fill="#edf4fe" font-weight="400">合并、裁剪、组织证据与引用；没有足够证据则明确无法确认。</text><text x="83" y="2656" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2656" font-size="20" fill="#74d7ad" font-weight="400">证据可用 → K6；证据不足 → K7</text><text x="83" y="2692" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2692" font-size="20" fill="#b8c8dd" font-weight="400">不允许以“看起来合理”替代证据。</text><text x="83" y="2728" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2728" font-size="20" fill="#f1be63" font-weight="400">材料说明只覆盖照片时，不补造“必须三张”的要求。</text></g><g class="side-node" data-box="866,2506,294,157"><rect x="866" y="2506" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2535" font-size="20" fill="#f1be63" font-weight="700">证据不足 → K7</text><text x="882" y="2571" font-size="19" fill="#f3dee0" font-weight="400">不编造答案；返回无法确认及</text><text x="882" y="2598" font-size="19" fill="#f3dee0" font-weight="400">下一步，由平台决定人工等处</text><text x="882" y="2625" font-size="19" fill="#f3dee0" font-weight="400">理。</text></g><g id="K6" class="node" data-box="64,2835,728,303"><rect x="64" y="2835" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="2849" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="2870" font-size="22" fill="#65cbe0" font-weight="700">K6  LLM 生成及原有后处理</text><text x="83" y="2901" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：KF Stage 6 / LangChain</text><text x="83" y="2937" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2937" font-size="20" fill="#d7e8fa" font-weight="400">授权证据、Prompt、模型配置</text><text x="83" y="2973" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2973" font-size="20" fill="#edf4fe" font-weight="400">生成文本并做引用等后处理；平台普通咨询可受控预览，高风险缓</text><text x="141" y="3001" font-size="20" fill="#edf4fe" font-weight="400">冲。</text><text x="83" y="3037" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3037" font-size="20" fill="#74d7ad" font-weight="400">候选答案和引用，不是正式会话成功</text><text x="83" y="3073" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3073" font-size="20" fill="#b8c8dd" font-weight="400">LLM 不持有交易执行权限；引用检查不保证所有事实正确。</text><text x="83" y="3109" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3109" font-size="20" fill="#f1be63" font-weight="400">通用材料说明可预览；订单资格 / 金额承诺不先流出。</text></g><g id="K7" class="node" data-box="64,3216,728,303"><rect x="64" y="3216" width="728" height="303" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="3230" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="3251" font-size="22" fill="#74d7ad" font-weight="700">K7  KF 统一收尾</text><text x="83" y="3282" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：KF Stage 7 / finish_success；异常 finish_error</text><text x="83" y="3318" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="3318" font-size="20" fill="#d7e8fa" font-weight="400">主路或直答 / FAQ / 证据不足旁路的子结果</text><text x="83" y="3354" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="3354" font-size="20" fill="#edf4fe" font-weight="400">保留诊断历史写入和 Trace；经包装层归一化 end /</text><text x="141" y="3382" font-size="20" fill="#edf4fe" font-weight="400">error。</text><text x="83" y="3418" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3418" font-size="20" fill="#74d7ad" font-weight="400">子调用结果 → N4；MIXED 回图 08 T04，纯知识去图 10</text><text x="83" y="3454" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3454" font-size="20" fill="#b8c8dd" font-weight="400">add_turn 写隔离诊断域，不回灌下一轮正式历史。</text><text x="83" y="3490" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3490" font-size="20" fill="#f1be63" font-weight="400">KF end 已发生，但 N3 未保存时浏览器仍不能显示正式完成。</text></g><g class="side-node" data-box="866,3240,294,179"><rect x="866" y="3240" width="294" height="179" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="3269" font-size="20" fill="#f1be63" font-weight="700">任一步依赖故障</text><text x="882" y="3305" font-size="19" fill="#f3dee0" font-weight="400">归一化失败；无真实降级结果</text><text x="882" y="3332" font-size="19" fill="#f3dee0" font-weight="400">则失败，不能把 error 转</text><text x="882" y="3359" font-size="19" fill="#f3dee0" font-weight="400">成功 end。</text><a href="V1分层流程与示例.html#publish" data-open="publish"><text x="882" y="3393" font-size="18" fill="#65cbe0" font-weight="700">查看图 10 →</text></a></g>
<text x="42" y="3600" font-size="18" fill="#b8c8dd" font-weight="400">N1–N9 是责任节点，不是执行顺序；示例字段帮助审查，不替代后续正式 API / 数据合同。</text>
</svg>