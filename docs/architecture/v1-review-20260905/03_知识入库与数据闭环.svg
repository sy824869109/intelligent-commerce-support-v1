<text x="1107.5" y="929.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">修订后重走</text>
<text x="1107.5" y="960.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">B1 或 B5 → B6</text>
<polyline points="860,1175.0 950,1175.0" fill="none" stroke="#697782" stroke-width="2"/>
<polygon points="950,1175.0 940.4737205583712,1180.5 940.4737205583712,1169.5" fill="#697782"/>
<rect x="950" y="1120" width="315" height="140" rx="8" fill="#F5F7F9" stroke="#697782" stroke-width="1.5"/>
<text x="1107.5" y="1144.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">发布异常</text>
<text x="1107.5" y="1179.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">回滚上一有效版本</text>
<text x="1107.5" y="1210.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">用旧版本继续 B8</text>
<polyline points="480,1790 480,1860 225,1860 225,1910" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="225,1910 219.5,1900.4737205583713 230.5,1900.4737205583713" fill="#28668E"/>
<polyline points="480,1790 480,1860 650,1860 650,1910" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="650,1910 644.5,1900.4737205583713 655.5,1900.4737205583713" fill="#28668E"/>
