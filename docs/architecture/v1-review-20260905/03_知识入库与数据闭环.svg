<rect x="45" y="1910" width="360" height="175" rx="8" fill="#F0F8F4" stroke="#267862" stroke-width="1.5"/>
<text x="225.0" y="1952.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">知识与 FAQ 改进</text>
<text x="225.0" y="1987.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">B1 或 B5 → B6 → B7</text>
<text x="225.0" y="2018.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">评测通过后发布下一版</text>
</a>
<rect x="470" y="1910" width="360" height="175" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="650.0" y="1952.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">Prompt 或路由改进</text>
<text x="650.0" y="1987.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">测试 → 审核 → 发布</text>
<text x="650.0" y="2018.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">回到 B8 观察新结果</text>
<a href="#04">
<rect x="895" y="1910" width="360" height="175" rx="8" fill="#FFF8EB" stroke="#A36C23" stroke-width="1.5"/>
<text x="1075.0" y="1952.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">业务事实或人工改进</text>
<text x="1075.0" y="1987.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">责任域接口校验与纠正</text>
<text x="1075.0" y="2018.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">回到 B8 继续服务</text>
</a>
<text x="650" y="2150" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#697782">关联键贯穿消息 运行记录 业务单 工单 知识片段 评测与发布；未经审核不写正式知识。</text>
<text x="650" y="2200" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#697782">删除或撤权先改变可见性，再异步清理索引与缓存；新反馈进入下一轮归因。</text>
</svg>