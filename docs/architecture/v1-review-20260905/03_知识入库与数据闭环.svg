<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="2270" viewBox="0 0 1300 2270"><rect width="1300" height="2270" fill="white"/>
<text x="35" y="27" dominant-baseline="text-before-edge" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172B3A">图 3  从一份知识资料向下展开完整闭环</text>
<text x="35" y="75" dominant-baseline="text-before-edge" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#697782">从资料输入走到下一轮改进；失败旁支说明回到哪一步，不绘制跨层回线。</text>
<rect x="100" y="125" width="760" height="90" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="480.0" y="140.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B1 起点  运营提交一份知识资料</text>
<text x="480.0" y="175.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Gateway → N6；校验类型 大小 权限与重复内容</text>
<rect x="100" y="260" width="760" height="110" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="480.0" y="269.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B2 保存原文与元数据</text>
<text x="480.0" y="304.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">MinIO 保存原文；MySQL 保存元数据与 Outbox</text>
<text x="480.0" y="335.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">跨存储失败登记状态，补偿并清理孤立对象</text>
<polyline points="480,215 480,260" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="480,260 474.5,250.47372055837118 485.5,250.47372055837118" fill="#28668E"/>
<rect x="100" y="415" width="760" height="100" rx="8" fill="#F8F5FC" stroke="#7157A3" stroke-width="1.5"/>
<text x="480.0" y="435.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B3 可靠投递知识任务</text>
<text x="480.0" y="470.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Outbox → Redis Streams；收到确认后标记投递状态</text>
<polyline points="480,370 480,415" fill="none" stroke="#7157A3" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="480,415 474.5,405.47372055837116 485.5,405.47372055837116" fill="#7157A3"/>
<rect x="100" y="560" width="760" height="110" rx="8" fill="#F8F5FC" stroke="#7157A3" stroke-width="1.5"/>
<text x="480.0" y="569.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B4 Worker 消费与加工</text>
<text x="480.0" y="604.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">解析 → 分块 → Embedding；event_id 去重</text>
<text x="480.0" y="635.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">调用知识域接口；失败重试 死信与对账</text>
<polyline points="480,515 480,560" fill="none" stroke="#7157A3" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="480,560 474.5,550.4737205583712 485.5,550.4737205583712" fill="#7157A3"/>
<rect x="100" y="715" width="760" height="110" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="480.0" y="724.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B5 构建候选知识版本</text>
<text x="480.0" y="759.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Milvus 保存向量与稀疏索引</text>
<text x="480.0" y="790.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">MySQL 保存片段映射 版本与任务状态</text>
<polyline points="480,670 480,715" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="480,715 474.5,705.4737205583712 485.5,705.4737205583712" fill="#28668E"/>
<rect x="100" y="870" width="760" height="110" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="480.0" y="879.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B6 回归评测与人工审核</text>
<text x="480.0" y="914.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">黄金集 / 引用 / 权限 / 质量 / 性能</text>
<text x="480.0" y="945.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">评测通过并获准后才进入发布</text>
<polyline points="480,825 480,870" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="480,870 474.5,860.4737205583712 485.5,860.4737205583712" fill="#28668E"/>
<rect x="100" y="1120" width="760" height="110" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="480.0" y="1129.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B7 发布有效知识版本</text>
<text x="480.0" y="1164.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">索引完整后切换 active kb_version</text>
<text x="480.0" y="1195.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">单次请求固定版本；缓存按版本隔离</text>
<polyline points="480,980 480,1120" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="480,1120 474.5,1110.4737205583713 485.5,1110.4737205583713" fill="#28668E"/>
<rect x="100" y="1370" width="760" height="110" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="480.0" y="1379.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B8 在线问答与业务结果</text>
<text x="480.0" y="1414.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">N3 正式消息 + N4 路由 + N5 业务 + N7 工单</text>
<text x="480.0" y="1445.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">关联知识版本 来源片段 与 Trace</text>
<polyline points="480,1230 480,1370" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="480,1370 474.5,1360.4737205583713 485.5,1360.4737205583713" fill="#28668E"/>
<rect x="100" y="1525" width="760" height="110" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="480.0" y="1534.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B9 用户评价与人工纠错</text>
<text x="480.0" y="1569.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">N3 保存评价；N7 保存纠错和处理结果</text>
<text x="480.0" y="1600.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">追加纠错，不覆盖原始回答</text>
<polyline points="480,1480 480,1525" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="480,1525 474.5,1515.4737205583713 485.5,1515.4737205583713" fill="#28668E"/>
<rect x="100" y="1680" width="760" height="110" rx="8" fill="#F0F6FA" stroke="#28668E" stroke-width="1.5"/>
<text x="480.0" y="1689.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B3A">B10 Bad Case 归因与运营审核</text>
<text x="480.0" y="1724.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Worker 汇总，N6 外层治理保存（归属建议）</text>
<text x="480.0" y="1755.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172B3A">区分知识 Prompt 路由 业务数据与人工处理原因</text>
<polyline points="480,1635 480,1680" fill="none" stroke="#28668E" stroke-width="2"/>
<polygon points="480,1680 474.5,1670.4737205583713 485.5,1670.4737205583713" fill="#28668E"/>
