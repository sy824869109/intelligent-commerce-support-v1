<text x="42" y="49" font-size="30" fill="#65cbe0" font-weight="700">第 1 层 · 一条主干看全程</text>
<text x="42" y="86" font-size="20" fill="#b8c8dd" font-weight="400">纵向实线＝选中路径的先后顺序；侧向虚线＝条件出口 / 例外；跨图入口标注目的地。</text>
<text x="42" y="119" font-size="19" fill="#f1be63" font-weight="400">V1 目标设计 · 标准 1.1 · 示例均为虚构 DEMO · 不代表运行验收通过</text>
<path class="flow-edge side-edge" d="M792,282 H856"/><path class="flow-edge side-edge" d="M792,635 H856"/><path class="flow-edge side-edge" d="M792,1016 H856"/><path class="flow-edge side-edge" d="M792,1955 H856"/><path class="flow-edge side-edge" d="M792,2816 H856"/><path class="flow-edge" d="M428,498 V566"/><path class="flow-edge" d="M428,879 V947"/><path class="flow-edge" d="M428,1232 V1385"/><path class="flow-edge" d="M428,1733 V1886"/><path class="flow-edge" d="M428,2206 V2274"/><path class="flow-edge" d="M428,2594 V2747"/><path class="flow-edge" d="M428,3032 V3100"/><path class="flow-edge" d="M428,3420 V3488"/><rect x="42" y="158" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="187" font-size="21" fill="#c3d5eb" font-weight="700">① 接收：谁在操作，允许做什么</text><rect x="42" y="1330" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="1359" font-size="21" fill="#c3d5eb" font-weight="700">② 判断：先排除不能做，再决定怎样做</text><rect x="42" y="1831" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="1860" font-size="21" fill="#c3d5eb" font-weight="700">③ 执行：子图内部再逐步展开</text><rect x="42" y="2692" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="2721" font-size="21" fill="#c3d5eb" font-weight="700">④ 后续：本轮完成后，才发生新动作</text><text x="449" y="530" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="911" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1264" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1765" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2238" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2626" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="3064" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="3452" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><g id="A01" class="node" data-box="64,223,728,275"><rect x="64" y="223" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="237" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="258" font-size="22" fill="#65cbe0" font-weight="700">A01  用户发起一次请求</text><text x="83" y="289" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：客户浏览器 / 客服台 / 管理台</text><text x="83" y="325" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="325" font-size="20" fill="#d7e8fa" font-weight="400">问题文本，或页面操作；登录凭据</text><text x="83" y="361" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="361" font-size="20" fill="#edf4fe" font-weight="400">区分聊天入口与页面入口，不把页面申请伪造成聊天。</text><text x="83" y="397" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="397" font-size="20" fill="#74d7ad" font-weight="400">聊天 → A02；页面 → 图 13；知识上传 → 图 12</text><text x="83" y="433" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="433" font-size="20" fill="#b8c8dd" font-weight="400">此时尚无服务端业务结果。</text><text x="83" y="469" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="469" font-size="20" fill="#f1be63" font-weight="400">客户问：O1001 的杯子裂了，可以申请退货吗？</text></g><g class="side-node" data-box="866,247,294,152"><rect x="866" y="247" width="294" height="152" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="276" font-size="20" fill="#f1be63" font-weight="700">其他入口</text><text x="882" y="312" font-size="19" fill="#f3dee0" font-weight="400">页面申请见图 13；管理台知</text><text x="882" y="339" font-size="19" fill="#f3dee0" font-weight="400">识处理见图 12。</text><a href="V1分层流程与示例.html#page" data-open="page"><text x="882" y="373" font-size="18" fill="#65cbe0" font-weight="700">查看图 13 →</text></a></g><g id="A02" class="node" data-box="64,576,728,303"><rect x="64" y="576" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="590" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="611" font-size="22" fill="#65cbe0" font-weight="700">A02  统一入口与身份权限</text><text x="83" y="642" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N1 Nginx → N2 Gateway / IAM</text><text x="83" y="678" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="678" font-size="20" fill="#d7e8fa" font-weight="400">请求、身份凭据、租户和目标资源</text><text x="83" y="714" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="714" font-size="20" fill="#edf4fe" font-weight="400">校验登录、租户、角色、限流及输入；业务域再校验归属。</text><text x="83" y="750" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="750" font-size="20" fill="#74d7ad" font-weight="400">已认证 actor / tenant / request_id /</text><text x="141" y="778" font-size="20" fill="#74d7ad" font-weight="400">trace_id</text><text x="83" y="814" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="814" font-size="20" fill="#b8c8dd" font-weight="400">N2 保存自己拥有的安全审计；不写订单。</text><text x="83" y="850" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="850" font-size="20" fill="#f1be63" font-weight="400">DEMO 租户 T01 的 U01 登录成功。</text></g><g class="side-node" data-box="866,600,294,130"><rect x="866" y="600" width="294" height="130" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="629" font-size="20" fill="#f1be63" font-weight="700">不通过 → 在入口结束</text><text x="882" y="665" font-size="19" fill="#f3dee0" font-weight="400">未登录、越权或超限：返回安</text><text x="882" y="692" font-size="19" fill="#f3dee0" font-weight="400">全错误，不继续业务执行。</text></g><g id="A03" class="node" data-box="64,957,728,275"><rect x="64" y="957" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="971" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="992" font-size="22" fill="#65cbe0" font-weight="700">A03  保存本轮输入，取得会话控制资格</text><text x="83" y="1023" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N3 Conversation → N4 Orchestration</text><text x="83" y="1059" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1059" font-size="20" fill="#d7e8fa" font-weight="400">授权身份、conversation_id、消息幂等键</text><text x="83" y="1095" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1095" font-size="20" fill="#edf4fe" font-weight="400">N3 保存输入和控制快照；允许 AI 时预留资格，N4 建 Run。</text><text x="83" y="1131" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1131" font-size="20" fill="#74d7ad" font-weight="400">正式历史快照、control_epoch；适用时有 run_id</text><text x="83" y="1167" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1167" font-size="20" fill="#b8c8dd" font-weight="400">N3：消息 / 控制；N4：Run；不在锁中等待模型。</text><text x="83" y="1203" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1203" font-size="20" fill="#f1be63" font-weight="400">C01 / R01 / epoch=7；当前问句与历史分开。</text></g><g class="side-node" data-box="866,981,294,179"><rect x="866" y="981" width="294" height="179" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1010" font-size="20" fill="#f1be63" font-weight="700">已经人工接管</text><text x="882" y="1046" font-size="19" fill="#f3dee0" font-weight="400">保存客户消息并通知人工；不</text><text x="882" y="1073" font-size="19" fill="#f3dee0" font-weight="400">再启动可公开答复的 AI</text><text x="882" y="1100" font-size="19" fill="#f3dee0" font-weight="400">Run。</text><a href="V1分层流程与示例.html#human" data-open="human"><text x="882" y="1134" font-size="18" fill="#65cbe0" font-weight="700">查看图 11 →</text></a></g><g id="A04" class="node" data-box="64,1395,728,338"><rect x="64" y="1395" width="728" height="338" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="1409" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="1430" font-size="22" fill="#f1be63" font-weight="700">A04  逐级判断本轮应走哪条路</text><text x="83" y="1461" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 确定性编排</text><text x="83" y="1497" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1497" font-size="20" fill="#d7e8fa" font-weight="400">本轮问题 + 控制模式 + Workflow + 权限</text><text x="83" y="1533" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1533" font-size="20" fill="#edf4fe" font-weight="400">先安全与人工，再已有流程，再补充信息，最后选业务路径。</text><text x="83" y="1569" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1569" font-size="20" fill="#74d7ad" font-weight="400">CLARIFY / READ / KNOWLEDGE / MIXED /</text><text x="141" y="1597" font-size="20" fill="#74d7ad" font-weight="400">COMMAND 等</text><text x="83" y="1633" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1633" font-size="20" fill="#b8c8dd" font-weight="400">N4 保存路由原因和工作流版本。</text><text x="83" y="1669" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1669" font-size="20" fill="#f1be63" font-weight="400">既问具体订单，又问政策 → MIXED。</text><a href="V1分层流程与示例.html#routing" data-open="routing"><text x="83" y="1705" font-size="18" fill="#65cbe0" font-weight="700">展开图 07 → 路由按优先级逐关判断</text></a></g><g id="A05" class="node" data-box="64,1896,728,310"><rect x="64" y="1896" width="728" height="310" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1910" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1931" font-size="22" fill="#65cbe0" font-weight="700">A05  只执行被选中的分支</text><text x="83" y="1962" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 协调 N5 / N6 / N7</text><text x="83" y="1998" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1998" font-size="20" fill="#d7e8fa" font-weight="400">确定的路由、最少业务参数、授权范围</text><text x="83" y="2034" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2034" font-size="20" fill="#edf4fe" font-weight="400">读业务 → N5；知识 → N6/KF；混合 → N5→N6→N5。</text><text x="83" y="2070" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2070" font-size="20" fill="#74d7ad" font-weight="400">带事实 / 来源 / 状态的领域结果，不是模型自由承诺。</text><text x="83" y="2106" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2106" font-size="20" fill="#b8c8dd" font-weight="400">N5 业务；N6 知识；N7 工单，各写自己的数据。</text><text x="83" y="2142" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2142" font-size="20" fill="#f1be63" font-weight="400">查 O1001 → 检索 P003 → N5 判定可提交申请。</text><a href="V1分层流程与示例.html#mixed" data-open="mixed"><text x="83" y="2178" font-size="18" fill="#65cbe0" font-weight="700">展开图 08 → 例 1：售后咨询到受控申请</text></a></g><g class="side-node" data-box="866,1920,294,152"><rect x="866" y="1920" width="294" height="152" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1949" font-size="20" fill="#f1be63" font-weight="700">人工分支</text><text x="882" y="1985" font-size="19" fill="#f3dee0" font-weight="400">先真实建单受理；人工稍后回</text><text x="882" y="2012" font-size="19" fill="#f3dee0" font-weight="400">复是另一条异步流程。</text><a href="V1分层流程与示例.html#human" data-open="human"><text x="882" y="2046" font-size="18" fill="#65cbe0" font-weight="700">查看图 11 →</text></a></g><g id="A06" class="node" data-box="64,2284,728,310"><rect x="64" y="2284" width="728" height="310" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="2298" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="2319" font-size="22" fill="#74d7ad" font-weight="700">A06  校验结果，正式保存，再通知完成</text><text x="83" y="2350" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 检查 → N3 正式消息 → N2 / N1</text><text x="83" y="2386" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2386" font-size="20" fill="#d7e8fa" font-weight="400">执行结果、来源、Run / epoch 和关联业务 ID</text><text x="83" y="2422" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2422" font-size="20" fill="#edf4fe" font-weight="400">检查权限与输出；N3 事务校验资格、写消息和通知 Outbox。</text><text x="83" y="2458" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2458" font-size="20" fill="#74d7ad" font-weight="400">message.committed 后才 run.completed</text><text x="83" y="2494" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2494" font-size="20" fill="#b8c8dd" font-weight="400">正式消息只认 N3；KF 内部 end 不是平台完成。</text><text x="83" y="2530" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2530" font-size="20" fill="#f1be63" font-weight="400">M02：可申请，仍需确认；没有自动创建退货单。</text><a href="V1分层流程与示例.html#publish" data-open="publish"><text x="83" y="2566" font-size="18" fill="#65cbe0" font-weight="700">展开图 10 → 所有 AI 分支怎样正式收口</text></a></g><g id="A07" class="node" data-box="64,2757,728,275"><rect x="64" y="2757" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="2771" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="2792" font-size="22" fill="#65cbe0" font-weight="700">A07  用户继续、确认、转人工或评价</text><text x="83" y="2823" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：浏览器 → 所属领域</text><text x="83" y="2859" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2859" font-size="20" fill="#d7e8fa" font-weight="400">新的用户动作，不沿用旧动作的授权</text><text x="83" y="2895" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2895" font-size="20" fill="#edf4fe" font-weight="400">确认进入新一轮；评价单独保存；断线重连补查正式结果。</text><text x="83" y="2931" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2931" font-size="20" fill="#74d7ad" font-weight="400">新一轮 A01，或反馈事件，或人工接管请求</text><text x="83" y="2967" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2967" font-size="20" fill="#b8c8dd" font-weight="400">N3 反馈；N4 草稿确认；N5 申请；N7 人工记录。</text><text x="83" y="3003" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3003" font-size="20" fill="#f1be63" font-weight="400">U01 点明确确认后才走申请；点差评则进入治理。</text></g><g class="side-node" data-box="866,2781,294,157"><rect x="866" y="2781" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2810" font-size="20" fill="#f1be63" font-weight="700">不是全部都要做</text><text x="882" y="2846" font-size="19" fill="#f3dee0" font-weight="400">追问 / 申请 / 人工 / 评</text><text x="882" y="2873" font-size="19" fill="#f3dee0" font-weight="400">价是不同后续动作，可选其一</text><text x="882" y="2900" font-size="19" fill="#f3dee0" font-weight="400">或结束。</text></g><g id="A08" class="node" data-box="64,3110,728,310"><rect x="64" y="3110" width="728" height="310" rx="12" fill="#122137" stroke="#c1adff" stroke-width="2"/><rect x="64" y="3124" width="5" height="38" rx="2" fill="#c1adff"/><text x="83" y="3145" font-size="22" fill="#c1adff" font-weight="700">A08  反馈进入修复与验证闭环</text><text x="83" y="3176" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：各领域 Outbox → N8 → 责任领域</text><text x="83" y="3212" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="3212" font-size="20" fill="#d7e8fa" font-weight="400">评价、错误、人工纠正及原始消息 / 版本引用</text><text x="83" y="3248" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="3248" font-size="20" fill="#edf4fe" font-weight="400">归因 → 审核 → 修复 → 独立回归 → 审批发布。</text><text x="83" y="3284" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3284" font-size="20" fill="#74d7ad" font-weight="400">通过门禁的版本；失败仍留候选态</text><text x="83" y="3320" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3320" font-size="20" fill="#b8c8dd" font-weight="400">原始反馈不被覆盖；修复和发布留审计。</text><text x="83" y="3356" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3356" font-size="20" fill="#f1be63" font-weight="400">P003 表述有歧义 → 修订候选 P004，不直接上线。</text><a href="V1分层流程与示例.html#closure" data-open="closure"><text x="83" y="3392" font-size="18" fill="#65cbe0" font-weight="700">展开图 12 → 例 3：一次差评如何真正闭环</text></a></g><g id="A09" class="node" data-box="64,3498,728,275"><rect x="64" y="3498" width="728" height="275" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="3512" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="3533" font-size="22" fill="#74d7ad" font-weight="700">A09  下一次请求验证改进是否有效</text><text x="83" y="3564" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：新请求 → N4 / N6 / N5</text><text x="83" y="3600" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="3600" font-size="20" fill="#d7e8fa" font-weight="400">新授权快照 + 当前可用且兼容的已发布版本</text><text x="83" y="3636" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="3636" font-size="20" fill="#edf4fe" font-weight="400">读取新版本服务，再采集效果；失败可回到已验证版本。</text><text x="83" y="3672" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3672" font-size="20" fill="#74d7ad" font-weight="400">重新从 A01 开始，而不是复活旧 Run</text><text x="83" y="3708" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3708" font-size="20" fill="#b8c8dd" font-weight="400">保留发布版本、回归证据与新请求关联。</text><text x="83" y="3744" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3744" font-size="20" fill="#f1be63" font-weight="400">R09 使用 KB004；回归后同类问题得到清楚解释。</text></g>
<text x="42" y="3854" font-size="18" fill="#b8c8dd" font-weight="400">N1–N9 是责任节点，不是执行顺序；示例字段帮助审查，不替代后续正式 API / 数据合同。</text>
</svg>