<title id="title-closure">第 2 层 · 例 3：一次差评如何真正闭环</title>
<defs><marker id="arrow-closure" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#65cbe0"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#diagram-closure .flow-edge{fill:none;stroke:#65cbe0;stroke-width:2;marker-end:url(#arrow-closure)}#diagram-closure .side-edge{stroke-dasharray:6 4}a:hover text{text-decoration:underline}</style>
<rect width="1200" height="3413" fill="#0c1626"/>
<text x="42" y="49" font-size="30" fill="#65cbe0" font-weight="700">第 2 层 · 例 3：一次差评如何真正闭环</text>
<text x="42" y="86" font-size="20" fill="#b8c8dd" font-weight="400">纵向实线＝选中路径的先后顺序；侧向虚线＝条件出口 / 例外；跨图入口标注目的地。</text>
<text x="42" y="119" font-size="19" fill="#f1be63" font-weight="400">V1 目标设计 · 标准 1.1 · 示例均为虚构 DEMO · 不代表运行验收通过</text>
<path class="flow-edge side-edge" d="M792,635 H856"/><path class="flow-edge side-edge" d="M792,1101 H856"/><path class="flow-edge side-edge" d="M792,1510 H856"/><path class="flow-edge side-edge" d="M792,2357 H856"/><path class="flow-edge side-edge" d="M792,2738 H856"/><path class="flow-edge" d="M428,498 V566"/><path class="flow-edge" d="M428,879 V1032"/><path class="flow-edge" d="M428,1373 V1441"/><path class="flow-edge" d="M428,1754 V1822"/><path class="flow-edge" d="M428,2135 V2288"/><path class="flow-edge" d="M428,2601 V2669"/><path class="flow-edge" d="M428,2954 V3022"/><rect x="42" y="158" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="187" font-size="21" fill="#c3d5eb" font-weight="700">采集：消息 → 反馈 → 可追溯的修复项</text><rect x="42" y="977" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="1006" font-size="21" fill="#c3d5eb" font-weight="700">构建：原文候选 → 派生索引候选</text><rect x="42" y="2233" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="2262" font-size="21" fill="#c3d5eb" font-weight="700">发布门：独立回归 → 审批 → 激活</text><text x="449" y="530" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="911" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1405" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1786" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2167" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2633" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2986" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><g id="Q01" class="node" data-box="64,223,728,275"><rect x="64" y="223" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="237" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="258" font-size="22" fill="#65cbe0" font-weight="700">Q01  收集原始反馈或人工纠错</text><text x="83" y="289" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：用户 → N3；客服纠错 → N7</text><text x="83" y="325" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="325" font-size="20" fill="#d7e8fa" font-weight="400">M02 / R01、评价理由、版本引用</text><text x="83" y="361" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="361" font-size="20" fill="#edf4fe" font-weight="400">保存原始证据与本领域 Outbox；不让评价直接改知识答案。</text><text x="83" y="397" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="397" font-size="20" fill="#74d7ad" font-weight="400">FB01：材料说明含糊；可追溯 P003 / KB003</text><text x="83" y="433" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="433" font-size="20" fill="#b8c8dd" font-weight="400">N3 评价；N7 纠错，各保留原文与合法引用。</text><text x="83" y="469" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="469" font-size="20" fill="#f1be63" font-weight="400">用户差评：“没有讲清楚要提供什么照片。”</text></g><g id="Q02" class="node" data-box="64,576,728,303"><rect x="64" y="576" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="590" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="611" font-size="22" fill="#65cbe0" font-weight="700">Q02  可靠投递并归因到责任领域</text><text x="83" y="642" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：Outbox Relay → Redis → N8 → 责任领域</text><text x="83" y="678" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="678" font-size="20" fill="#d7e8fa" font-weight="400">反馈 / 错误事件、来源、event_id</text><text x="83" y="714" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="714" font-size="20" fill="#edf4fe" font-weight="400">去重、审核；知识归 N6，路由 N4，业务 N5，人工 N7。</text><text x="83" y="750" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="750" font-size="20" fill="#74d7ad" font-weight="400">本例建立知识修复项，关联 FB01 与证据</text><text x="83" y="786" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="786" font-size="20" fill="#b8c8dd" font-weight="400">责任领域 Inbox 与效果提交后才 ACK；跨域总工作项归属待</text><text x="141" y="814" font-size="20" fill="#b8c8dd" font-weight="400">M13 ADR。</text><text x="83" y="850" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="850" font-size="20" fill="#f1be63" font-weight="400">物流数据错误应修 N5 数据链，不用改 Prompt 掩盖。</text></g><g class="side-node" data-box="866,600,294,157"><rect x="866" y="600" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="629" font-size="20" fill="#f1be63" font-weight="700">重复 / 不可处理事件</text><text x="882" y="665" font-size="19" fill="#f3dee0" font-weight="400">同 ID 幂等；未知 schema</text><text x="882" y="692" font-size="19" fill="#f3dee0" font-weight="400">隔离告警；超限重试进入人工</text><text x="882" y="719" font-size="19" fill="#f3dee0" font-weight="400">处理。</text></g><g id="Q03" class="node" data-box="64,1042,728,331"><rect x="64" y="1042" width="728" height="331" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1056" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1077" font-size="22" fill="#65cbe0" font-weight="700">Q03  审核修复建议，准备候选原文</text><text x="83" y="1108" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：管理台 → N2 → N6</text><text x="83" y="1144" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1144" font-size="20" fill="#d7e8fa" font-weight="400">经批准的修订内容、权限范围与责任人</text><text x="83" y="1180" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1180" font-size="20" fill="#edf4fe" font-weight="400">确认缺陷归因和修订依据；上传受控文件并检查类型 / 大小 /</text><text x="141" y="1208" font-size="20" fill="#edf4fe" font-weight="400">内容安全。</text><text x="83" y="1244" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1244" font-size="20" fill="#74d7ad" font-weight="400">P004 候选原文；未安全通过不能标 READY</text><text x="83" y="1280" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1280" font-size="20" fill="#b8c8dd" font-weight="400">MinIO 保存原文；N6 MySQL 保存状态 / 哈希 /</text><text x="141" y="1308" font-size="20" fill="#b8c8dd" font-weight="400">Outbox。</text><text x="83" y="1344" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1344" font-size="20" fill="#f1be63" font-weight="400">补清楚照片应覆盖哪里；不能凭差评杜撰商家规则。</text></g><g class="side-node" data-box="866,1066,294,130"><rect x="866" y="1066" width="294" height="130" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1095" font-size="20" fill="#f1be63" font-weight="700">也可从上传进入</text><text x="882" y="1131" font-size="19" fill="#f3dee0" font-weight="400">日常知识新增直接从此处开始</text><text x="882" y="1158" font-size="19" fill="#f3dee0" font-weight="400">；不要求先产生差评。</text></g><g id="Q04" class="node" data-box="64,1451,728,303"><rect x="64" y="1451" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1465" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1486" font-size="22" fill="#65cbe0" font-weight="700">Q04  处理跨存储中间状态</text><text x="83" y="1517" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N6 / 受托 N8 处理器</text><text x="83" y="1553" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1553" font-size="20" fill="#d7e8fa" font-weight="400">上传对象、元数据、哈希与状态</text><text x="83" y="1589" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1589" font-size="20" fill="#edf4fe" font-weight="400">VALIDATING 通过后 READY；对象与元数据失配时补偿或隔</text><text x="141" y="1617" font-size="20" fill="#edf4fe" font-weight="400">离。</text><text x="83" y="1653" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1653" font-size="20" fill="#74d7ad" font-weight="400">可解析的授权原文；尚不可正式检索</text><text x="83" y="1689" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1689" font-size="20" fill="#b8c8dd" font-weight="400">对象写入与 SQL 不是一个原子事务。</text><text x="83" y="1725" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1725" font-size="20" fill="#f1be63" font-weight="400">对象上传成功但登记失败 → 隔离补偿，不直接发布。</text></g><g class="side-node" data-box="866,1475,294,157"><rect x="866" y="1475" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1504" font-size="20" fill="#f1be63" font-weight="700">撤回 / 检查失败</text><text x="882" y="1540" font-size="19" fill="#f3dee0" font-weight="400">先禁止访问；清理 / 重建异</text><text x="882" y="1567" font-size="19" fill="#f3dee0" font-weight="400">步对账，缺失安全检查不算通</text><text x="882" y="1594" font-size="19" fill="#f3dee0" font-weight="400">过。</text></g><g id="Q05" class="node" data-box="64,1832,728,303"><rect x="64" y="1832" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1846" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1867" font-size="22" fill="#65cbe0" font-weight="700">Q05  解析、切片、向量化、构建候选</text><text x="83" y="1898" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N6 处理器；N8 调度</text><text x="83" y="1934" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1934" font-size="20" fill="#d7e8fa" font-weight="400">READY 原文、解析配置、目标知识版本</text><text x="83" y="1970" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1970" font-size="20" fill="#edf4fe" font-weight="400">清洗解析 → 分块 → Embedding → 候选索引；按哈希与版</text><text x="141" y="1998" font-size="20" fill="#edf4fe" font-weight="400">本去重。</text><text x="83" y="2034" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2034" font-size="20" fill="#74d7ad" font-weight="400">KB004 候选索引与来源块映射</text><text x="83" y="2070" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2070" font-size="20" fill="#b8c8dd" font-weight="400">MinIO 原文；MySQL 元数据；Milvus 派生索引。</text><text x="83" y="2106" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2106" font-size="20" fill="#f1be63" font-weight="400">用同一兼容向量配置建 KB004；线上仍读 KB003。</text></g><g id="Q06" class="node" data-box="64,2298,728,303"><rect x="64" y="2298" width="728" height="303" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="2312" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="2333" font-size="22" fill="#f1be63" font-weight="700">Q06  独立回归和质量门禁</text><text x="83" y="2364" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N6 / 相关领域测试与审核人</text><text x="83" y="2400" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2400" font-size="20" fill="#d7e8fa" font-weight="400">候选版本、原 Bad Case、Golden Set、验收指标</text><text x="83" y="2436" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2436" font-size="20" fill="#edf4fe" font-weight="400">验证正确性、权限隔离、失败恢复、质量和性能；修复样本之外也</text><text x="141" y="2464" font-size="20" fill="#edf4fe" font-weight="400">回归。</text><text x="83" y="2500" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2500" font-size="20" fill="#74d7ad" font-weight="400">证据完整且门禁通过 → Q07；失败 → 修复候选</text><text x="83" y="2536" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2536" font-size="20" fill="#b8c8dd" font-weight="400">保留评测配置、数据版本与结果；阈值未冻结不准发布。</text><text x="83" y="2572" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2572" font-size="20" fill="#f1be63" font-weight="400">原问题回答清楚，同时确认未泄露另一个商家的政策。</text></g><g class="side-node" data-box="866,2322,294,157"><rect x="866" y="2322" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2351" font-size="20" fill="#f1be63" font-weight="700">回归未通过</text><text x="882" y="2387" font-size="19" fill="#f3dee0" font-weight="400">回 Q03–Q05 修复；线上版</text><text x="882" y="2414" font-size="19" fill="#f3dee0" font-weight="400">本不变，不以“跑过一次”代替</text><text x="882" y="2441" font-size="19" fill="#f3dee0" font-weight="400">验收。</text></g><g id="Q07" class="node" data-box="64,2679,728,275"><rect x="64" y="2679" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="2693" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="2714" font-size="22" fill="#f1be63" font-weight="700">Q07  审批并激活兼容版本组合</text><text x="83" y="2745" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：授权发布人 → 各领域版本端口</text><text x="83" y="2781" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2781" font-size="20" fill="#d7e8fa" font-weight="400">KB / 规则 / Router / Prompt 等兼容关系与审批</text><text x="83" y="2817" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2817" font-size="20" fill="#edf4fe" font-weight="400">索引完整后切换；缓存绑定版本；审计发布并可回退已验证组合。</text><text x="83" y="2853" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2853" font-size="20" fill="#74d7ad" font-weight="400">KB004 发布；本例 RULE003 不变且已证明兼容</text><text x="83" y="2889" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2889" font-size="20" fill="#b8c8dd" font-weight="400">知识 / 规则 / 路由版本分别由其领域拥有，不跨表修改。</text><text x="83" y="2925" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2925" font-size="20" fill="#f1be63" font-weight="400">政策有效时间按批准规则解释，不强行套最新政策到旧订单。</text></g><g class="side-node" data-box="866,2703,294,130"><rect x="866" y="2703" width="294" height="130" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2732" font-size="20" fill="#f1be63" font-weight="700">发布失败 / 撤权</text><text x="882" y="2768" font-size="19" fill="#f3dee0" font-weight="400">保留或回退已验证版本；权限</text><text x="882" y="2795" font-size="19" fill="#f3dee0" font-weight="400">撤销优先于固定版本和缓存。</text></g><g id="Q08" class="node" data-box="64,3032,728,275"><rect x="64" y="3032" width="728" height="275" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="3046" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="3067" font-size="22" fill="#74d7ad" font-weight="700">Q08  新请求验证效果，归档关闭证据</text><text x="83" y="3098" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：新请求 → N4 / N6；审核人 → 责任领域</text><text x="83" y="3134" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="3134" font-size="20" fill="#d7e8fa" font-weight="400">新 R09 + KB004；FB01 对应的修复与回归证据</text><text x="83" y="3170" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="3170" font-size="20" fill="#edf4fe" font-weight="400">新请求读取已发布版本，独立核对改善；保留继续观察和回退依据。</text><text x="83" y="3206" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3206" font-size="20" fill="#74d7ad" font-weight="400">形成一次完整闭环；回图 06 A01</text><text x="83" y="3242" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3242" font-size="20" fill="#b8c8dd" font-weight="400">反馈 → 修复 → 测试 → 审批 → 发布 → 新请求均可追溯。</text><text x="83" y="3278" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3278" font-size="20" fill="#f1be63" font-weight="400">R09 给出清楚的照片说明；满足约定门禁后关闭修复项。</text></g>
<text x="42" y="3388" font-size="18" fill="#b8c8dd" font-weight="400">N1–N9 是责任节点，不是执行顺序；示例字段帮助审查，不替代后续正式 API / 数据合同。</text>
</svg>