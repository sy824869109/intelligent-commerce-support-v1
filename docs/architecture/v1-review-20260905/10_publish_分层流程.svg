<svg xmlns="http://www.w3.org/2000/svg" id="diagram-publish" width="1200" height="2947" viewBox="0 0 1200 2947" role="img" aria-labelledby="title-publish">
<title id="title-publish">第 2 层 · 所有 AI 分支怎样正式收口</title>
<defs><marker id="arrow-publish" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#65cbe0"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#diagram-publish .flow-edge{fill:none;stroke:#65cbe0;stroke-width:2;marker-end:url(#arrow-publish)}#diagram-publish .side-edge{stroke-dasharray:6 4}a:hover text{text-decoration:underline}</style>
<rect width="1200" height="2947" fill="#0c1626"/>
<text x="42" y="49" font-size="30" fill="#65cbe0" font-weight="700">第 2 层 · 所有 AI 分支怎样正式收口</text>
<text x="42" y="86" font-size="20" fill="#b8c8dd" font-weight="400">纵向实线＝选中路径的先后顺序；侧向虚线＝条件出口 / 例外；跨图入口标注目的地。</text>
<text x="42" y="119" font-size="19" fill="#f1be63" font-weight="400">V1 目标设计 · 标准 1.1 · 示例均为虚构 DEMO · 不代表运行验收通过</text>
<path class="flow-edge side-edge" d="M792,635 H856"/><path class="flow-edge side-edge" d="M792,1369 H856"/><path class="flow-edge side-edge" d="M792,2244 H856"/><path class="flow-edge" d="M428,498 V566"/><path class="flow-edge" d="M428,851 V919"/><path class="flow-edge" d="M428,1232 V1300"/><path class="flow-edge" d="M428,1613 V1766"/><path class="flow-edge" d="M428,2107 V2175"/><path class="flow-edge" d="M428,2488 V2556"/><rect x="42" y="158" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="187" font-size="21" fill="#c3d5eb" font-weight="700">第一道门：这个结果是否真实可发布</text><rect x="42" y="1711" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="1740" font-size="21" fill="#c3d5eb" font-weight="700">第二道门：消息确实保存，才通知完成</text><text x="449" y="530" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="883" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1264" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1645" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2139" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2520" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><g id="F01" class="node" data-box="64,223,728,275"><rect x="64" y="223" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="237" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="258" font-size="22" fill="#65cbe0" font-weight="700">F01  接收真实结果或明确失败</text><text x="83" y="289" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4</text><text x="83" y="325" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="325" font-size="20" fill="#d7e8fa" font-weight="400">N5 事实 / 命令、N6 子结果、N7 受理或澄清文本</text><text x="83" y="361" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="361" font-size="20" fill="#edf4fe" font-weight="400">归一化为有来源与实际状态的结果；不把 KF error 改为成功。</text><text x="83" y="397" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="397" font-size="20" fill="#74d7ad" font-weight="400">待检查结果，或明确失败 / 真实降级结果</text><text x="83" y="433" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="433" font-size="20" fill="#b8c8dd" font-weight="400">N4 记录执行状态；领域事实仍归各领域。</text><text x="83" y="469" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="469" font-size="20" fill="#f1be63" font-weight="400">CMD01 成功创建 AS001；不代表 AS001 审核通过。</text></g><g id="F02" class="node" data-box="64,576,728,275"><rect x="64" y="576" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="590" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="611" font-size="22" fill="#f1be63" font-weight="700">F02  复核权限、控制和输出安全</text><text x="83" y="642" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4；N3 最终提交守卫</text><text x="83" y="678" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="678" font-size="20" fill="#d7e8fa" font-weight="400">答案、来源、Run、epoch、当前授权版本</text><text x="83" y="714" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="714" font-size="20" fill="#edf4fe" font-weight="400">重验引用可见性、字段脱敏和当前发布资格。</text><text x="83" y="750" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="750" font-size="20" fill="#74d7ad" font-weight="400">可发布 → F03；旧 Run / 越权结果 → 抑制或失败</text><text x="83" y="786" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="786" font-size="20" fill="#b8c8dd" font-weight="400">执行终态和 publication_status 分开记录。</text><text x="83" y="822" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="822" font-size="20" fill="#f1be63" font-weight="400">R01 已被 R02 取代：旧答案不再正式发布。</text></g><g class="side-node" data-box="866,600,294,157"><rect x="866" y="600" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="629" font-size="20" fill="#f1be63" font-weight="700">旧结果 / 权限撤销</text><text x="882" y="665" font-size="19" fill="#f3dee0" font-weight="400">SUPPRESSED 或安全失败；</text><text x="882" y="692" font-size="19" fill="#f3dee0" font-weight="400">不能复活旧 Run，也不能回</text><text x="882" y="719" font-size="19" fill="#f3dee0" font-weight="400">灌其草稿。</text></g><g id="F03" class="node" data-box="64,929,728,303"><rect x="64" y="929" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="943" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="964" font-size="22" fill="#65cbe0" font-weight="700">F03  区分预览与最终文本</text><text x="83" y="995" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → 平台流适配</text><text x="83" y="1031" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1031" font-size="20" fill="#d7e8fa" font-weight="400">受控 token 或已缓冲的高风险结果</text><text x="83" y="1067" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1067" font-size="20" fill="#edf4fe" font-weight="400">普通 answer.delta 仅草稿；高风险先仅发 progress，</text><text x="141" y="1095" font-size="20" fill="#edf4fe" font-weight="400">检查后提交完整结果。</text><text x="83" y="1131" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1131" font-size="20" fill="#74d7ad" font-weight="400">候选最终文本；尚未宣称本轮正式完成</text><text x="83" y="1167" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1167" font-size="20" fill="#b8c8dd" font-weight="400">delta 不要求逐 token 持久化；没有恢复游标就补快照。</text><text x="83" y="1203" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1203" font-size="20" fill="#f1be63" font-weight="400">资金 / 资格场景不先发送全文再事后遮罩。</text></g><g id="F04" class="node" data-box="64,1310,728,303"><rect x="64" y="1310" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1324" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1345" font-size="22" fill="#65cbe0" font-weight="700">F04  同一事务保存正式消息和通知</text><text x="83" y="1376" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N3 Conversation</text><text x="83" y="1412" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1412" font-size="20" fill="#d7e8fa" font-weight="400">最终文本、引用、关联 ID、发布幂等键</text><text x="83" y="1448" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1448" font-size="20" fill="#edf4fe" font-weight="400">事务内校验 Run / epoch / 唯一键，写正式消息和通知</text><text x="141" y="1476" font-size="20" fill="#edf4fe" font-weight="400">Outbox。</text><text x="83" y="1512" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1512" font-size="20" fill="#74d7ad" font-weight="400">正式 message_id + message_seq + 发布回执</text><text x="83" y="1548" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1548" font-size="20" fill="#b8c8dd" font-weight="400">N3 MySQL 是正式会话权威，不以 Redis 或 KF 历史替代。</text><text x="83" y="1584" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1584" font-size="20" fill="#f1be63" font-weight="400">M04 关联 R03 / CMD01 / AS001，只生成一条正式答复。</text></g><g class="side-node" data-box="866,1334,294,157"><rect x="866" y="1334" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1363" font-size="20" fill="#f1be63" font-weight="700">保存失败 / 回执丢失</text><text x="882" y="1399" font-size="19" fill="#f3dee0" font-weight="400">查同一发布结果；只补偿同一</text><text x="882" y="1426" font-size="19" fill="#f3dee0" font-weight="400">答案发布，不重新运行 KF</text><text x="882" y="1453" font-size="19" fill="#f3dee0" font-weight="400">或退款申请。</text></g><g id="F05" class="node" data-box="64,1776,728,331"><rect x="64" y="1776" width="728" height="331" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="1790" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="1811" font-size="22" fill="#74d7ad" font-weight="700">F05  持久化之后发送平台完成事件</text><text x="83" y="1842" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N3 / N4 → N2 → N1 → 浏览器</text><text x="83" y="1878" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1878" font-size="20" fill="#d7e8fa" font-weight="400">正式保存凭据及授权通知流</text><text x="83" y="1914" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1914" font-size="20" fill="#edf4fe" font-weight="400">发 message.committed，再完成 run.completed；KF</text><text x="141" y="1942" font-size="20" fill="#edf4fe" font-weight="400">end 只代表子调用结束。</text><text x="83" y="1978" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1978" font-size="20" fill="#74d7ad" font-weight="400">客户端取得正式 MessagePart / 来源 / 状态</text><text x="83" y="2014" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2014" font-size="20" fill="#b8c8dd" font-weight="400">SSE 持久游标由平台定义，不复用 Redis ID /</text><text x="141" y="2042" font-size="20" fill="#b8c8dd" font-weight="400">token_seq。</text><text x="83" y="2078" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2078" font-size="20" fill="#f1be63" font-weight="400">先收到 M04 的正式版本，再显示“本轮完成”。</text></g><g id="F06" class="node" data-box="64,2185,728,303"><rect x="64" y="2185" width="728" height="303" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="2199" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="2220" font-size="22" fill="#74d7ad" font-weight="700">F06  正式消息替换草稿并支持恢复</text><text x="83" y="2251" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：授权浏览器 / N3</text><text x="83" y="2287" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2287" font-size="20" fill="#d7e8fa" font-weight="400">message_id、正式全文、持久游标或会话快照</text><text x="83" y="2323" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2323" font-size="20" fill="#edf4fe" font-weight="400">最终全文替换草稿；重连重新鉴权、补事件或查 snapshot，</text><text x="141" y="2351" font-size="20" fill="#edf4fe" font-weight="400">按 ID 去重。</text><text x="83" y="2387" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2387" font-size="20" fill="#74d7ad" font-weight="400">一致的聊天记录；断连不重复办理业务</text><text x="83" y="2423" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2423" font-size="20" fill="#b8c8dd" font-weight="400">客户端不是权威存储；无法补 token 时恢复正式快照。</text><text x="83" y="2459" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2459" font-size="20" fill="#f1be63" font-weight="400">同一 M04 重到两次仍只显示一次，不把全文追加成双份。</text></g><g class="side-node" data-box="866,2209,294,157"><rect x="866" y="2209" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2238" font-size="20" fill="#f1be63" font-weight="700">客户端断线</text><text x="882" y="2274" font-size="19" fill="#f3dee0" font-weight="400">申请可以已经成功；重连查</text><text x="882" y="2301" font-size="19" fill="#f3dee0" font-weight="400">CMD01 / AS001，不自动</text><text x="882" y="2328" font-size="19" fill="#f3dee0" font-weight="400">再提交。</text></g><g id="F07" class="node" data-box="64,2566,728,275"><rect x="64" y="2566" width="728" height="275" rx="12" fill="#122137" stroke="#c1adff" stroke-width="2"/><rect x="64" y="2580" width="5" height="38" rx="2" fill="#c1adff"/><text x="83" y="2601" font-size="22" fill="#c1adff" font-weight="700">F07  下一轮只读取正式授权上下文</text><text x="83" y="2632" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N3 → N6 请求级适配</text><text x="83" y="2668" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2668" font-size="20" fill="#d7e8fa" font-weight="400">当前仍可访问的正式消息 / 摘要</text><text x="83" y="2704" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2704" font-size="20" fill="#edf4fe" font-weight="400">排除私密备注、未发布答案与失败草稿；当前问句单独传入。</text><text x="83" y="2740" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2740" font-size="20" fill="#74d7ad" font-weight="400">新 Run 的正式快照；回图 06 A01</text><text x="83" y="2776" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2776" font-size="20" fill="#b8c8dd" font-weight="400">摘要绑定源消息和权限版本；诊断历史不自动合入。</text><text x="83" y="2812" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2812" font-size="20" fill="#f1be63" font-weight="400">即便 KF 写了 R01 诊断，若未正式发布，下轮也不读该答案。</text></g>
<text x="42" y="2922" font-size="18" fill="#b8c8dd" font-weight="400">N1–N9 是责任节点，不是执行顺序；示例字段帮助审查，不替代后续正式 API / 数据合同。</text>
</svg>