<text x="650" y="1380" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#697782">各域只写自有表；跨域通知通过版本化事件；N9 记录全程脱敏 Trace。</text>
