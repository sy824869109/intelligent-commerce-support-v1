<title id="title-human">第 2 层 · 例 2：从找人工到真实回复</title>
<defs><marker id="arrow-human" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#65cbe0"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#diagram-human .flow-edge{fill:none;stroke:#65cbe0;stroke-width:2;marker-end:url(#arrow-human)}#diagram-human .side-edge{stroke-dasharray:6 4}a:hover text{text-decoration:underline}</style>
<rect width="1200" height="4133" fill="#0c1626"/>
<text x="42" y="49" font-size="30" fill="#65cbe0" font-weight="700">第 2 层 · 例 2：从找人工到真实回复</text>
<text x="42" y="86" font-size="20" fill="#b8c8dd" font-weight="400">纵向实线＝选中路径的先后顺序；侧向虚线＝条件出口 / 例外；跨图入口标注目的地。</text>
<text x="42" y="119" font-size="19" fill="#f1be63" font-weight="400">V1 目标设计 · 标准 1.1 · 示例均为虚构 DEMO · 不代表运行验收通过</text>
<path class="flow-edge side-edge" d="M792,663 H856"/><path class="flow-edge side-edge" d="M792,1898 H856"/><path class="flow-edge side-edge" d="M792,2251 H856"/><path class="flow-edge" d="M428,526 V594"/><path class="flow-edge" d="M428,907 V975"/><path class="flow-edge" d="M428,1323 V1476"/><path class="flow-edge" d="M428,1761 V1829"/><path class="flow-edge" d="M428,2114 V2182"/><path class="flow-edge" d="M428,2467 V2620"/><path class="flow-edge" d="M428,2905 V2973"/><path class="flow-edge" d="M428,3286 V3354"/><path class="flow-edge" d="M428,3674 V3742"/><rect x="42" y="158" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="187" font-size="21" fill="#c3d5eb" font-weight="700">本轮同步：先管住 AI，再真实受理</text><rect x="42" y="1421" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="1450" font-size="21" fill="#c3d5eb" font-weight="700">后续异步：认领 → 握手 → 开放回复</text><rect x="42" y="2565" width="1116" height="43" rx="8" fill="#20324a"/><text x="60" y="2594" font-size="21" fill="#c3d5eb" font-weight="700">送达：跨领域至少一次投递，而非直接推一条文本</text><text x="449" y="558" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="939" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="1355" font-size="17" fill="#b4c9df" font-weight="400">之后客服上线认领，才发生下方事件</text><text x="449" y="1793" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2146" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2499" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="2937" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="3318" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><text x="449" y="3706" font-size="17" fill="#b4c9df" font-weight="400">继续向下</text><g id="H01" class="node" data-box="64,223,728,303"><rect x="64" y="223" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="237" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="258" font-size="22" fill="#65cbe0" font-weight="700">H01  用户要求人工</text><text x="83" y="289" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → N3</text><text x="83" y="325" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="325" font-size="20" fill="#d7e8fa" font-weight="400">“我要找人工”，当前 C01 / epoch</text><text x="83" y="361" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="361" font-size="20" fill="#edf4fe" font-weight="400">先让 N3 进入 HANDOFF_PENDING，递增控制代次，隔离旧</text><text x="141" y="389" font-size="20" fill="#edf4fe" font-weight="400">AI 发布。</text><text x="83" y="425" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="425" font-size="20" fill="#74d7ad" font-weight="400">稳定 handoff_request_id=HD01，进入待接管</text><text x="83" y="461" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="461" font-size="20" fill="#b8c8dd" font-weight="400">N3 保存模式；N4 失效未用确认，已提交命令另行对账。</text><text x="83" y="497" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="497" font-size="20" fill="#f1be63" font-weight="400">正在生成的旧退款建议不再作为新正式答案发出。</text></g><g id="H02" class="node" data-box="64,604,728,303"><rect x="64" y="604" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="618" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="639" font-size="22" fill="#65cbe0" font-weight="700">H02  幂等创建或关联人工工单</text><text x="83" y="670" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → N7 Ticket</text><text x="83" y="706" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="706" font-size="20" fill="#d7e8fa" font-weight="400">HD01、授权公开上下文和用户诉求</text><text x="83" y="742" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="742" font-size="20" fill="#edf4fe" font-weight="400">N7 保存受理工单并返回真实 ticket_id；重复请求关联原工</text><text x="141" y="770" font-size="20" fill="#edf4fe" font-weight="400">单。</text><text x="83" y="806" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="806" font-size="20" fill="#74d7ad" font-weight="400">TK01 + 实际受理状态</text><text x="83" y="842" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="842" font-size="20" fill="#b8c8dd" font-weight="400">N7 持有工单；上下文按最小权限引用。</text><text x="83" y="878" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="878" font-size="20" fill="#f1be63" font-weight="400">重复点“找人工”仍关联 TK01。</text></g><g class="side-node" data-box="866,628,294,157"><rect x="866" y="628" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="657" font-size="20" fill="#f1be63" font-weight="700">创建失败</text><text x="882" y="693" font-size="19" fill="#f3dee0" font-weight="400">只能显示尚未成功受理；重试</text><text x="882" y="720" font-size="19" fill="#f3dee0" font-weight="400">原 HD01，不虚构排队号或等</text><text x="882" y="747" font-size="19" fill="#f3dee0" font-weight="400">待时长。</text></g><g id="H03" class="node" data-box="64,985,728,338"><rect x="64" y="985" width="728" height="338" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="999" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="1020" font-size="22" fill="#74d7ad" font-weight="700">H03  保存受理说明，本轮结束</text><text x="83" y="1051" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N4 → N3 → 图 10</text><text x="83" y="1087" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1087" font-size="20" fill="#d7e8fa" font-weight="400">TK01 和当前真实受理状态</text><text x="83" y="1123" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1123" font-size="20" fill="#edf4fe" font-weight="400">经允许的接管受理发布路径保存系统说明；不是旧 AI 继续自由</text><text x="141" y="1151" font-size="20" fill="#edf4fe" font-weight="400">生成。</text><text x="83" y="1187" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1187" font-size="20" fill="#74d7ad" font-weight="400">客户看见“已受理，等待接管”，本轮结束</text><text x="83" y="1223" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1223" font-size="20" fill="#b8c8dd" font-weight="400">N3 保存受理消息；N7 保存工单事实。</text><text x="83" y="1259" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1259" font-size="20" fill="#f1be63" font-weight="400">此时允许等待或留言，不声称客服已在线处理。</text><a href="V1分层流程与示例.html#publish" data-open="publish"><text x="83" y="1295" font-size="18" fill="#65cbe0" font-weight="700">展开图 10 → 所有 AI 分支怎样正式收口</text></a></g><g id="H04" class="node" data-box="64,1486,728,275"><rect x="64" y="1486" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="1500" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="1521" font-size="22" fill="#65cbe0" font-weight="700">H04  客服认领，取得唯一有效分配</text><text x="83" y="1552" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：客服台 → N2 → N7</text><text x="83" y="1588" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1588" font-size="20" fill="#d7e8fa" font-weight="400">客服权限、TK01 版本和分配请求</text><text x="83" y="1624" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1624" font-size="20" fill="#edf4fe" font-weight="400">N7 原子检查竞争，只有一人获得有效 assignment。</text><text x="83" y="1660" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="1660" font-size="20" fill="#74d7ad" font-weight="400">ASSIGN01，activation=PENDING</text><text x="83" y="1696" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="1696" font-size="20" fill="#b8c8dd" font-weight="400">N7 保存分配事实；不是直接修改 N3 会话表。</text><text x="83" y="1732" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="1732" font-size="20" fill="#f1be63" font-weight="400">客服 A 与 B 同时抢单，只能一个有效。</text></g><g id="H05" class="node" data-box="64,1839,728,275"><rect x="64" y="1839" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="1853" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="1874" font-size="22" fill="#f1be63" font-weight="700">H05  N3 确认 HUMAN 后才开放回复</text><text x="83" y="1905" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N7 → N3 CAS → N7</text><text x="83" y="1941" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="1941" font-size="20" fill="#d7e8fa" font-weight="400">ASSIGN01、expected_epoch、目标模式</text><text x="83" y="1977" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="1977" font-size="20" fill="#edf4fe" font-weight="400">版本化握手；N3 确认 HUMAN 后，客服台才启用公开回复。</text><text x="83" y="2013" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2013" font-size="20" fill="#74d7ad" font-weight="400">真实接管成功；activation=ACTIVE</text><text x="83" y="2049" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2049" font-size="20" fill="#b8c8dd" font-weight="400">N3 控制事实；N7 分配同步状态，各自幂等。</text><text x="83" y="2085" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2085" font-size="20" fill="#f1be63" font-weight="400">响应丢失查同 ASSIGN01，不再建第二份分配。</text></g><g class="side-node" data-box="866,1863,294,130"><rect x="866" y="1863" width="294" height="130" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="1892" font-size="20" fill="#f1be63" font-weight="700">握手未确认</text><text x="882" y="1928" font-size="19" fill="#f3dee0" font-weight="400">仍显示待激活；同分配查询 /</text><text x="882" y="1955" font-size="19" fill="#f3dee0" font-weight="400">重试，禁止先公开回复。</text></g><g id="H06" class="node" data-box="64,2192,728,275"><rect x="64" y="2192" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="2206" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="2227" font-size="22" fill="#65cbe0" font-weight="700">H06  客服提交公开回复或内部备注</text><text x="83" y="2258" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N7</text><text x="83" y="2294" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2294" font-size="20" fill="#d7e8fa" font-weight="400">当前有效分配、回复正文、公开性</text><text x="83" y="2330" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2330" font-size="20" fill="#edf4fe" font-weight="400">重新验证权限；公开回复与 Outbox 同事务保存。</text><text x="83" y="2366" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2366" font-size="20" fill="#74d7ad" font-weight="400">REPLY01 + EVT01；内部备注不生成客户公开事件</text><text x="83" y="2402" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2402" font-size="20" fill="#b8c8dd" font-weight="400">N7 持有回复原稿、内部备注和人工纠错。</text><text x="83" y="2438" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2438" font-size="20" fill="#f1be63" font-weight="400">“请补充破损照片”公开；内部风控备注不发给客户。</text></g><g class="side-node" data-box="866,2216,294,157"><rect x="866" y="2216" width="294" height="157" rx="10" fill="#2b2330" stroke="#f1be63" stroke-dasharray="5 4"/><text x="882" y="2245" font-size="20" fill="#f1be63" font-weight="700">发生转派</text><text x="882" y="2281" font-size="19" fill="#f3dee0" font-weight="400">转派后旧客服新写入被拒；转</text><text x="882" y="2308" font-size="19" fill="#f3dee0" font-weight="400">派前已合法提交的公开回复可</text><text x="882" y="2335" font-size="19" fill="#f3dee0" font-weight="400">继续投递。</text></g><g id="H07" class="node" data-box="64,2630,728,275"><rect x="64" y="2630" width="728" height="275" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="2644" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="2665" font-size="22" fill="#65cbe0" font-weight="700">H07  Outbox 投递，Worker 转交所属服务</text><text x="83" y="2696" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N7 Relay → Redis Streams → N8 → N3</text><text x="83" y="2732" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="2732" font-size="20" fill="#d7e8fa" font-weight="400">已提交的公开事件 EVT01</text><text x="83" y="2768" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="2768" font-size="20" fill="#edf4fe" font-weight="400">按原事件 ID 重试；验证来源、公开性和原始提交凭据。</text><text x="83" y="2804" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="2804" font-size="20" fill="#74d7ad" font-weight="400">交 N3 幂等处理；还不能提前 ACK</text><text x="83" y="2840" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="2840" font-size="20" fill="#b8c8dd" font-weight="400">Redis 是投递层；N8 不直接改 N3 / N7 表。</text><text x="83" y="2876" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="2876" font-size="20" fill="#f1be63" font-weight="400">Worker 重启后可重新认领 EVT01。</text></g><g id="H08" class="node" data-box="64,2983,728,303"><rect x="64" y="2983" width="728" height="303" rx="12" fill="#122137" stroke="#65cbe0" stroke-width="2"/><rect x="64" y="2997" width="5" height="38" rx="2" fill="#65cbe0"/><text x="83" y="3018" font-size="22" fill="#65cbe0" font-weight="700">H08  N3 保存正式人工消息后 ACK</text><text x="83" y="3049" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N3 Inbox 处理器 → N8</text><text x="83" y="3085" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="3085" font-size="20" fill="#d7e8fa" font-weight="400">EVT01 / REPLY01、当前收件人权限</text><text x="83" y="3121" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="3121" font-size="20" fill="#edf4fe" font-weight="400">同事务写 Inbox、正式消息和通知 Outbox；持久成功再</text><text x="141" y="3149" font-size="20" fill="#edf4fe" font-weight="400">ACK。</text><text x="83" y="3185" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3185" font-size="20" fill="#74d7ad" font-weight="400">M07；重复 EVT01 返回原结果</text><text x="83" y="3221" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3221" font-size="20" fill="#b8c8dd" font-weight="400">N3 正式消息 M07；N7 原稿 REPLY01 保留署名。</text><text x="83" y="3257" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3257" font-size="20" fill="#f1be63" font-weight="400">效果已保存而 ACK 丢失：再投递也不多出一条消息。</text></g><g id="H09" class="node" data-box="64,3364,728,310"><rect x="64" y="3364" width="728" height="310" rx="12" fill="#122137" stroke="#74d7ad" stroke-width="2"/><rect x="64" y="3378" width="5" height="38" rx="2" fill="#74d7ad"/><text x="83" y="3399" font-size="22" fill="#74d7ad" font-weight="700">H09  客户收到回复，继续沟通或反馈</text><text x="83" y="3430" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N3 → N2 / N1 → 浏览器</text><text x="83" y="3466" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="3466" font-size="20" fill="#d7e8fa" font-weight="400">正式 M07 与授权通知</text><text x="83" y="3502" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="3502" font-size="20" fill="#edf4fe" font-weight="400">补事件 / 快照恢复、去重；评价回到反馈闭环。</text><text x="83" y="3538" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3538" font-size="20" fill="#74d7ad" font-weight="400">客户看到有署名的正式人工回复</text><text x="83" y="3574" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3574" font-size="20" fill="#b8c8dd" font-weight="400">N3 收集评价；纠错原始证据不覆盖。</text><text x="83" y="3610" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3610" font-size="20" fill="#f1be63" font-weight="400">客户离线时先保存；重新登录后可补查 M07。</text><a href="V1分层流程与示例.html#closure" data-open="closure"><text x="83" y="3646" font-size="18" fill="#65cbe0" font-weight="700">展开图 12 → 例 3：一次差评如何真正闭环</text></a></g><g id="H10" class="node" data-box="64,3752,728,275"><rect x="64" y="3752" width="728" height="275" rx="12" fill="#122137" stroke="#f1be63" stroke-width="2"/><rect x="64" y="3766" width="5" height="38" rx="2" fill="#f1be63"/><text x="83" y="3787" font-size="22" fill="#f1be63" font-weight="700">H10  分别处理工单结束和控制交还</text><text x="83" y="3818" font-size="18" fill="#b8c8dd" font-weight="400">责任节点：N7 / N3 / N5 各自领域</text><text x="83" y="3854" font-size="19" fill="#d7e8fa" font-weight="700">输入</text><text x="141" y="3854" font-size="20" fill="#d7e8fa" font-weight="400">明确的关闭、退出人工或售后办理动作</text><text x="83" y="3890" font-size="19" fill="#edf4fe" font-weight="700">处理</text><text x="141" y="3890" font-size="20" fill="#edf4fe" font-weight="400">每项独立授权与状态转换；未交还控制不自动续办旧草稿。</text><text x="83" y="3926" font-size="19" fill="#74d7ad" font-weight="700">输出</text><text x="141" y="3926" font-size="20" fill="#74d7ad" font-weight="400">工单关闭 ≠ AI 恢复 ≠ AS001 办结</text><text x="83" y="3962" font-size="19" fill="#b8c8dd" font-weight="700">落点</text><text x="141" y="3962" font-size="20" fill="#b8c8dd" font-weight="400">各领域保存自己的结束事实和审计。</text><text x="83" y="3998" font-size="19" fill="#f1be63" font-weight="700">示例</text><text x="141" y="3998" font-size="20" fill="#f1be63" font-weight="400">客服关闭 TK01，不代表退款已到账或自动创建新申请。</text></g>
<text x="42" y="4108" font-size="18" fill="#b8c8dd" font-weight="400">N1–N9 是责任节点，不是执行顺序；示例字段帮助审查，不替代后续正式 API / 数据合同。</text>
</svg>