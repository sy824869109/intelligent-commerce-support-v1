name: V1 foundation CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      # Official stable v6 lines, pinned to verified immutable commits.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Python from project baseline
        if: runner.os != 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
      # CPython 3.12 security-only releases lack upstream Windows installers.
      - name: Windows Conda from project baseline
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          miniforge-version: 26.5.3-0
          environment-file: ci/windows-environment.yml
          activate-environment: commerce-ci
          auto-update-conda: false
      - name: Install hash-locked CI tools only
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Format, static checks, contracts baseline, asset safety and unit tests
        run: python scripts/ci.py

  # These jobs are intentionally SKIPPED, never fake successful business tests.
  # ci-stages.json and verify_ci.py require activation when runtime inputs arrive.
  backend:
    name: Backend application tests (NOT IMPLEMENTED - M02)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Backend runtime tests are not implemented."
  frontend:
    name: Frontend tests (NOT IMPLEMENTED - M14)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Frontend runtime tests are not implemented."
  contracts:
    name: Runtime contract tests (NOT IMPLEMENTED - M02.3)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "OpenAPI and event runtime tests are not implemented."
  security-audit:
    name: Runtime SAST and dependency audit (NOT IMPLEMENTED - M02)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Runtime SAST and dependency audits are not implemented."
  image-build:
    name: Application image build (NOT IMPLEMENTED - first Dockerfile)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "No application Dockerfile exists; no image is built or published."
