name: V1 foundation CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      # Official stable v6 lines, pinned to verified immutable commits.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Python from project baseline
        if: runner.os != 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
      # CPython 3.12 security-only releases lack upstream Windows installers.
      - name: Windows Conda from project baseline
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          miniforge-version: 26.5.3-0
          environment-file: ci/windows-environment.yml
          activate-environment: commerce-ci
          auto-update-conda: false
      - name: Install hash-locked CI tools only
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Format, static checks, contracts baseline, asset safety and unit tests
        run: python scripts/ci.py

  # Backend/security are ACTIVE. Only unimplemented frontend/event-contract jobs are skipped.
  # ci-stages.json and verify_ci.py enforce real commands when runtime inputs arrive.
  backend:
    name: Backend application tests (${{ matrix.os }})
    needs: foundation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Python from project baseline
        if: runner.os != 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
      - name: Windows Conda from project baseline
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167
        with:
          miniforge-version: 26.5.3-0
          environment-file: ci/windows-environment.yml
          activate-environment: commerce-ci
          auto-update-conda: false
      - name: Install locked backend and gate tools
        run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api-gateway/requirements.lock -r ci/backend-requirements.lock'
      - name: Run backend tests
        run: python scripts/check_backend.py tests
  frontend:
    name: Frontend tests (NOT IMPLEMENTED - M14)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Frontend runtime tests are not implemented."
  contracts:
    name: Runtime contract tests (NOT IMPLEMENTED - M02.3)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "OpenAPI and event runtime tests are not implemented."
  security-audit:
    name: Backend SAST and dependency audit
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Python from project baseline
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
      - name: Install locked backend and gate tools
        run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api-gateway/requirements.lock -r ci/backend-requirements.lock'
      - name: Run backend security checks
        run: python scripts/check_backend.py security
  image-build:
    name: Reviewed ${{ matrix.name }} image build and vulnerability gate
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL
            path: mysql
          - name: Redis
            path: redis
          - name: etcd
            path: etcd
          - name: SeaweedFS
            path: seaweedfs
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed image recipes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      # Context is only the dependency recipe, never the workspace or local secrets.
      - name: Build reviewed dependency image without publishing
        run: |
          for attempt in 1 2 3; do
            if docker build --pull --provenance=false --sbom=false --progress=plain --platform=linux/amd64 --file "deploy/images/${{ matrix.path }}/Dockerfile" --tag "ics-${{ matrix.path }}:ci" "deploy/images/${{ matrix.path }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done
      - name: Python for MySQL integration
        if: matrix.path == 'mysql'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
      - name: Install locked MySQL integration tools
        if: matrix.path == 'mysql'
        run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api-gateway/requirements.lock -r ci/backend-requirements.lock'
      - name: Real MySQL migrations and transactional event tests
        if: matrix.path == 'mysql'
        run: python scripts/check_mysql.py --ci
      - name: Export only the built image for isolated scanning
        run: |
          mkdir -p "$RUNNER_TEMP/ics-image-scan"
          docker image save --output "$RUNNER_TEMP/ics-image-scan/${{ matrix.path }}.tar" "ics-${{ matrix.path }}:ci"
      # Scanner sees an image archive read-only, not Docker's socket or the repository.
      # No ignore-unfixed or ignore file: any HIGH/CRITICAL finding blocks this job.
      - name: Scan locked image archive and fail on HIGH or CRITICAL
        run: |
          docker run --rm --read-only --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=3g \
            --mount "type=bind,src=$RUNNER_TEMP/ics-image-scan,dst=/scan,readonly" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input "/scan/${{ matrix.path }}.tar" --cache-dir /tmp/trivy --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed=false --ignorefile /dev/null --timeout 20m

  # Milvus compiles OpenBLAS and a large C++/Go tree. Two hosted-runner attempts
  # made progress for 90/180 minutes but could not finish. Run the same strict
  # build and scan manually on the controlled Linux image-builder used for local
  # release evidence; a skipped push job is visible and never presented as PASS.
  milvus-audit:
    name: Milvus full source audit (manual, self-hosted)
    if: github.event_name == 'workflow_dispatch'
    needs: foundation
    runs-on: [self-hosted, linux, x64, ics-image-builder]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed Milvus recipe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Build reviewed Milvus image without publishing
        run: |
          for attempt in 1 2 3; do
            if docker build --pull --provenance=false --sbom=false --progress=plain --platform=linux/amd64 --file "deploy/images/milvus/Dockerfile" --tag "ics-milvus:ci" "deploy/images/milvus"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done
      - name: Export only the built Milvus image for isolated scanning
        run: |
          mkdir -p "$RUNNER_TEMP/ics-image-scan"
          docker image save --output "$RUNNER_TEMP/ics-image-scan/milvus.tar" "ics-milvus:ci"
      - name: Scan locked Milvus archive and fail on HIGH or CRITICAL
        run: |
          docker run --rm --read-only --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=3g \
            --mount "type=bind,src=$RUNNER_TEMP/ics-image-scan,dst=/scan,readonly" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input "/scan/milvus.tar" --cache-dir /tmp/trivy --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed=false --ignorefile /dev/null --timeout 20m
